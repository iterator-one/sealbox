name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to majors that run on node24: GitHub deprecated the node20
      # runtime for actions, and anything still on it is force-migrated with a
      # warning on every run.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # the tests use a real gpg: some of them create a throwaway keyring and
      # encrypt files with it to prove interoperability
      - name: Install GnuPG
        run: sudo apt-get update && sudo apt-get install -y gnupg

      - run: npm install
      - run: npm test

      # Electron's Chromium sandbox uses a setuid helper binary. npm unpacks it
      # as an ordinary user, so the bit has to be restored or Electron refuses
      # to start. Doing this instead of passing --no-sandbox keeps the smoke
      # test running the app the way a user runs it.
      - name: Restore the permissions of Electron's sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # Boot the real app in Electron. A unit test cannot see a renderer that
      # fails to parse — this step exists because exactly that shipped once.
      - name: Smoke test the packaged UI
        run: xvfb-run -a npm run smoke
        timeout-minutes: 5

      # The guarantees in SECURITY.md — no network, no shell strings, no address
      # outside src/links.js — are checked by `npm test` above, where a
      # violation is caught before a push rather than after one. See
      # test/guarantees.test.js. The greps that used to live here failed on an
      # address handed to the browser, which is not a network call.
