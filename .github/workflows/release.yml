name: release

# Builds the macOS .dmg and attaches it to a GitHub Release.
#
# A .dmg can only be produced on macOS — `hdiutil` and the code-signing tools
# are macOS-only, so this cannot be cross-built from Linux. GitHub's macOS
# runners do it for free on public repositories.
#
# How to cut a release:
#
#   git tag v1.2.2
#   git push origin v1.2.2
#
# A few minutes later the .dmg is attached to the Release page and anyone can
# download it.

on:
  push:
    tags: ['v*']
  # Manual runs must name the tag to publish. Without this a run started from
  # the Actions button uses the default branch, has no tag to attach anything
  # to, and finishes green having published nothing — which is how v1.2.0
  # appeared to succeed while the download link still served v1.1.0.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v1.2.1'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Decide, once, what is being released. Everything below uses this, so a
      # run can never quietly turn into a build that publishes nothing.
      - name: Which tag is this?
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            echo "This workflow publishes a tagged release, and no tag was given."
            echo "Push a tag (git tag v1.2.1 && git push origin v1.2.1), or start"
            echo "the workflow by hand and type the tag in the box."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      # Pinned to majors that run on node24 — GitHub deprecated the node20
      # action runtime.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      # never ship a build whose tests did not pass
      # already present on the runner image most of the time; never fail the release over it
      - run: brew install gnupg || true
      - run: npm test
      - run: npm run smoke
        timeout-minutes: 5

      # Bundle GnuPG into the app. Without this the user has to install it
      # themselves, and on a Mac without Homebrew that means pasting a command
      # into Terminal — which defeats the point of the app.
      #
      # The script signs the binaries ad-hoc after rewriting their load paths,
      # or Apple Silicon would refuse to run them. It bundles the runner's
      # architecture only; on a Mac of the other architecture the copy fails its
      # version probe and Sealbox falls back to a system GnuPG.
      #
      # Bundling GnuPG brings GPLv3 obligations — see LICENSES-THIRD-PARTY.md.
      - name: Vendor GnuPG into the app
        run: npm run vendor

      - name: Confirm the bundled GnuPG is signed and runs
        run: |
          vendor/gnupg/bin/gpg --version | head -1
          codesign --verify --verbose=1 vendor/gnupg/bin/gpg
          test -x vendor/gnupg/bin/scdaemon || (echo "scdaemon is missing — the card would be invisible" && exit 1)

      # `npm run dist` passes --publish never. Without it electron-builder sees
      # that the build was started from a tag, decides to upload the image to
      # GitHub by itself, finds no GH_TOKEN and fails — after the image has
      # already been built. Uploading is the job of the step below, which uses
      # the token the workflow already has.

      # Is a signing certificate configured? The `secrets` context cannot be
      # used in a step's `if:` — GitHub rejects the whole workflow file with
      # "Unrecognized named-value: 'secrets'" — so the answer is computed here
      # and read as a step output below. The secret is passed through the
      # environment rather than interpolated into the script, so its value never
      # becomes part of a command line.
      - name: Is a signing certificate configured?
        id: cert
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$CERT" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # Signed and notarised build. Runs only if those secrets exist, so a fork
      # without an Apple account still builds. With them macOS opens the app
      # with no warning at all:
      #
      #   MACOS_CERTIFICATE           base64 of a Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD  password of that .p12
      #   APPLE_ID                    the Apple ID that owns the certificate
      #   APPLE_APP_SPECIFIC_PASSWORD app-specific password from appleid.apple.com
      #   APPLE_TEAM_ID               10-character team id
      #
      # Notarisation uploads the build to Apple and waits for their scan,
      # which usually takes a few minutes.
      - name: Build the universal .dmg (signed and notarised)
        if: steps.cert.outputs.present == 'true'
        run: >
          npx electron-builder --mac --universal --publish never
          -c.mac.hardenedRuntime=true
          -c.mac.notarize.teamId="$APPLE_TEAM_ID"
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build the universal .dmg (unsigned)
        if: steps.cert.outputs.present != 'true'
        run: npm run dist
        env:
          # No Developer ID certificate, so the build is unsigned and macOS
          # warns on first launch. See INSTALL.md.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: What ended up inside the app
        run: |
          APP="dist/mac-universal/Sealbox.app"
          test -d "$APP" || APP="$(find dist -maxdepth 2 -name 'Sealbox.app' -print -quit)"
          echo "app: $APP"
          lipo -archs "$APP/Contents/MacOS/Sealbox" || true
          if [ -x "$APP/Contents/Resources/gnupg/bin/gpg" ]; then
            echo "bundled gpg: $(lipo -archs "$APP/Contents/Resources/gnupg/bin/gpg")"
            "$APP/Contents/Resources/gnupg/bin/gpg" --version | head -1
          else
            echo "no GnuPG inside the app — the setup screen would ask the user to install it"
            exit 1
          fi

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 Sealbox.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: sealbox-macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt

      # No `if:` here on purpose. The job already refused to start without a
      # tag, so reaching this step and skipping it is not a state that should
      # exist: a green run must mean a published release.
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          # make_latest keeps
          # /releases/latest/download/Sealbox.dmg pointing at this build —
          # that is the link the README download button uses.
          make_latest: true
          name: Sealbox ${{ steps.release.outputs.tag }}
          files: |
            dist/Sealbox.dmg
            dist/SHA256SUMS.txt
          body: |
            A free Mac app that encrypts any file before you send it.

            Download the `.dmg`, open it, drag Sealbox into Applications.

            This build is **not signed with an Apple Developer ID**, so macOS
            refuses to open it the first time. One-time step:

            * macOS 15 (Sequoia) and newer — try to open it once, dismiss the
              warning, then System Settings → Privacy & Security → Security →
              **Open Anyway**.
            * macOS 14 and older — right-click the app → Open → Open.

            Full instructions: [INSTALL.md](INSTALL.md)

            Check the download against `SHA256SUMS.txt`:

                shasum -a 256 Sealbox-*.dmg

            Read [SECURITY.md](SECURITY.md) before trusting anything you cannot
            afford to lose to this release.
