name: release

# Builds the macOS .dmg and attaches it to a GitHub Release.
#
# A .dmg can only be produced on macOS — `hdiutil` and the code-signing tools
# are macOS-only, so this cannot be cross-built from Linux. GitHub's macOS
# runners do it for free on public repositories.
#
# How to cut a release:
#
#   git tag v1.1.0
#   git push origin v1.1.0
#
# A few minutes later the .dmg is attached to the Release page and anyone can
# download it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      # Pinned to majors that run on node24 — GitHub deprecated the node20
      # action runtime.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      # never ship a build whose tests did not pass
      # already present on the runner image most of the time; never fail the release over it
      - run: brew install gnupg || true
      - run: npm test
      - run: npm run smoke
        timeout-minutes: 5

      # Releases deliberately ship WITHOUT a bundled GnuPG:
      #
      #   * tools/vendor-gpg.sh rewrites load paths inside the copied binaries,
      #     which invalidates their signatures — on Apple Silicon an unsigned
      #     binary will not run at all;
      #   * Homebrew's GnuPG is built for one architecture, so it would not
      #     match a universal app;
      #   * bundling GnuPG brings GPLv3 obligations (LICENSES-THIRD-PARTY.md).
      #
      # The app installs GnuPG itself on the first setup screen instead.
      # To bundle it anyway, uncomment the step below and test the result on
      # both architectures.
      #
      # - name: Vendor GnuPG into the app
      #   run: npm run vendor

      # `npm run dist` passes --publish never. Without it electron-builder sees
      # that the build was started from a tag, decides to upload the image to
      # GitHub by itself, finds no GH_TOKEN and fails — after the image has
      # already been built. Uploading is the job of the step below, which uses
      # the token the workflow already has.

      # Is a signing certificate configured? The `secrets` context cannot be
      # used in a step's `if:` — GitHub rejects the whole workflow file with
      # "Unrecognized named-value: 'secrets'" — so the answer is computed here
      # and read as a step output below. The secret is passed through the
      # environment rather than interpolated into the script, so its value never
      # becomes part of a command line.
      - name: Is a signing certificate configured?
        id: cert
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$CERT" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # Signed and notarised build. Runs only if those secrets exist, so a fork
      # without an Apple account still builds. With them macOS opens the app
      # with no warning at all:
      #
      #   MACOS_CERTIFICATE           base64 of a Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD  password of that .p12
      #   APPLE_ID                    the Apple ID that owns the certificate
      #   APPLE_APP_SPECIFIC_PASSWORD app-specific password from appleid.apple.com
      #   APPLE_TEAM_ID               10-character team id
      #
      # Notarisation uploads the build to Apple and waits for their scan,
      # which usually takes a few minutes.
      - name: Build the universal .dmg (signed and notarised)
        if: steps.cert.outputs.present == 'true'
        run: >
          npx electron-builder --mac --universal --publish never
          -c.mac.hardenedRuntime=true
          -c.mac.notarize.teamId="$APPLE_TEAM_ID"
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build the universal .dmg (unsigned)
        if: steps.cert.outputs.present != 'true'
        run: npm run dist
        env:
          # No Developer ID certificate, so the build is unsigned and macOS
          # warns on first launch. See INSTALL.md.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 Sealbox.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: sealbox-macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # make_latest keeps
          # /releases/latest/download/Sealbox.dmg pointing at this build —
          # that is the link the README download button uses.
          make_latest: true
          name: Sealbox ${{ github.ref_name }}
          files: |
            dist/Sealbox.dmg
            dist/SHA256SUMS.txt
          body: |
            A free Mac app that encrypts any file before you send it.

            Download the `.dmg`, open it, drag Sealbox into Applications.

            This build is **not signed with an Apple Developer ID**, so macOS
            refuses to open it the first time. One-time step:

            * macOS 15 (Sequoia) and newer — try to open it once, dismiss the
              warning, then System Settings → Privacy & Security → Security →
              **Open Anyway**.
            * macOS 14 and older — right-click the app → Open → Open.

            Full instructions: [INSTALL.md](INSTALL.md)

            Check the download against `SHA256SUMS.txt`:

                shasum -a 256 Sealbox-*.dmg

            Read [SECURITY.md](SECURITY.md) before trusting anything you cannot
            afford to lose to this release.
