 0; padding: 0; box-sizing: border-box; }\n[hidden] { display: none !important; }\n\n/* The icon sprite is markup, not a picture: without this it renders as a\n   300x150 replaced element and pushes the whole window down the page. */\n.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }\n\nhtml, body {\n  width: 520px;\n  height: 640px;\n  overflow: hidden;\n  background: transparent;\n}\n\nbody {\n  font-family: var(--font-ui);\n  font-size: 16px;\n  line-height: 19px;\n  color: var(--text);\n  -webkit-font-smoothing: antialiased;\n  user-select: none;\n  cursor: default;\n}\n\n/* ---------- window shell ---------- */\n\n.window {\n  width: 520px;\n  height: 640px;\n  background: var(--bg);\n  border: 1px solid var(--window-border);\n  border-radius: var(--radius-window);\n  overflow: hidden;\n  padding: 12px;\n  display: flex;\n  flex-direction: column;\n  gap: 22px;\n}\n\n/* The title bar is the app's drag handle; everything inside it must opt out\n   again or the buttons stop being clickable. */\n.titlebar {\n  width: var(--content);\n  height: 22px;\n  position: relative;\n  flex-shrink: 0;\n  -webkit-app-region: drag;\n}\n.traffic { position: absolute; left: 5px; top: 5px; display: flex; gap: 7px; -webkit-app-region: no-drag; }\n.traffic span {\n  width: 10px; height: 10px; border-radius: 100px;\n  border: 0.5px solid rgba(0, 0, 0, 0.1);\n}\n.traffic .close { background: #ff736a; }\n.traffic .min { background: #febc2e; }\n.traffic .zoom { background: #19c332; }\n.titlebar-title {\n  position: absolute; left: 50%; top: 4px; transform: translateX(-50%);\n  font-family: -apple-system, BlinkMacSystemFont, var(--font-ui);\n  font-size: 13px; font-weight: 700; line-height: 16px; color: #fff;\n}\n\n/* ---------- screens ---------- */\n\n.screens { flex: 1 0 0; width: var(--content); position: relative; }\n.screen { display: none; position: absolute; inset: 0; }\n.screen.is-active { display: flex; flex-direction: column; }\n\n/* Three shells, exactly as the design uses them. */\n.shell-centre { justify-content: center; align-items: center; gap: 12px; }\n.shell-top    { justify-content: flex-start; align-items: center; gap: 32px; padding: 24px 0; }\n.shell-split  { justify-content: space-between; align-items: center; padding: 24px 0; }\n.shell-success{ justify-content: center; align-items: center; gap: 24px; }\n\n/* ---------- type ---------- */\n\n.title {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: 28px;\n  line-height: 34px;\n  letter-spacing: -0.02em;\n  text-align: center;\n  color: var(--text);\n}\n.subtitle { font-size: 16px; line-height: 19px; color: var(--text-secondary); text-align: center; }\n.subtitle.plain { color: var(--text); }\n.caption { font-size: 14px; line-height: 17px; color: var(--text-secondary); text-align: center; }\n\n.heading { width: 100%; position: relative; display: flex; flex-direction: column; gap: 12px; }\n.heading .nav {\n  position: absolute; top: 5px; width: 24px; height: 24px;\n  cursor: pointer; opacity: 0.9;\n}\n.heading .nav:hover { opacity: 1; }\n.heading .nav.back { left: 0; }\n.heading .nav.close { right: 0; }\n\n/* ---------- buttons ---------- */\n\n.btn {\n  width: 260px; height: 52px;\n  border: 0; border-radius: var(--radius-card);\n  padding: 0 32px;\n  font-family: var(--font-ui); font-size: 16px; font-weight: 500; line-height: 19px;\n  display: flex; align-items: center; justify-content: center; gap: 10px;\n  cursor: pointer; flex-shrink: 0;\n}\n.btn.primary { background: var(--tech-blue); color: #fff; }\n.btn.primary:hover { background: #3d68ee; }\n.btn.secondary { background: var(--accent-soft); color: var(--ocean-blue); }\n.btn.secondary:hover { background: rgba(50, 95, 235, 0.28); }\n/* Two stacked washes — the design layers the blue over a white 3% surface. */\n.btn.secondary.raised {\n  background:\n    linear-gradient(var(--accent-soft), var(--accent-soft)),\n    linear-gradient(var(--surface), var(--surface));\n}\n.btn.inert { cursor: default; }\n.btn.inert:hover { background: var(--accent-soft); }\n.btn:disabled { opacity: 0.45; cursor: default; }\n\n.btn-stack { display: flex; flex-direction: column; align-items: center; gap: 12px; }\n.footer { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }\n\n/* A text-and-icon control with no chrome: \"Import public key\", \"Set up my Ledger\". */\n.linkbtn {\n  display: flex; align-items: center; gap: 8px;\n  height: 24px; background: none; border: 0; padding: 0;\n  color: var(--text); font-family: var(--font-ui); font-size: 16px; font-weight: 500; line-height: 19px;\n  cursor: pointer;\n}\n.linkbtn:hover { opacity: 0.85; }\n.linkbtn .icon { width: 24px; height: 24px; flex-shrink: 0; }\n.topbar { width: 100%; display: flex; justify-content: flex-end; padding-top: 24px; height: 48px; }\n\n/* ---------- file pill ---------- */\n\n.filepill {\n  display: inline-flex; align-items: center; gap: 6px;\n  height: 23px; padding: 2px 9px;\n  background: var(--accent-soft); border-radius: var(--radius-pill);\n  color: var(--ocean-blue); font-size: 16px; line-height: 19px;\n  white-space: nowrap; max-width: var(--content);\n}\n.filepill .icon { width: 12px; height: 12px; flex-shrink: 0; }\n.filepill .name { overflow: hidden; text-overflow: ellipsis; }\n.filepill .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; flex-shrink: 0; }\n\n.fileinfo { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }\n\n/* ---------- glow graphics ---------- */\n\n/* The drop graphic and the spinner are drawn, not exported: three concentric\n   rings plus two blurred discs. The blur bleeds far outside the layout box, so\n   nothing on the path may clip. */\n.glow { position: relative; flex-shrink: 0; }\n.glow > * { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; }\n.glow .g-core { width: 156px; height: 156px; background: var(--tech-blue); filter: blur(75px); }\n.glow .g-ring-1 { width: 148px; height: 148px; background: rgba(255, 255, 255, 0.05); }\n.glow .g-ring-2 { width: 104px; height: 104px; background: rgba(255, 255, 255, 0.1); }\n.glow .g-inner { width: 52px; height: 52px; background: #b9c6ee; filter: blur(45px); }\n.glow .g-mark { display: flex; align-items: center; justify-content: center; }\n\n.dropglow { width: 200px; height: 201px; }\n.dropglow .g-mark { width: 48px; height: 48px; }\n\n/* 96px ring with a rotating gap — the design's \"Loading indicator\". */\n.spinner { width: 96px; height: 96px; }\n.spinner .ring {\n  width: 96px; height: 96px;\n  border: 4px solid rgba(255, 255, 255, 0.12);\n  border-top-color: rgba(255, 255, 255, 0.85);\n  animation: spin 900ms linear infinite;\n}\n@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }\n.ring-sm {\n  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;\n  border: 2px solid rgba(255, 255, 255, 0.15);\n  border-top-color: rgba(255, 255, 255, 0.6);\n  animation: spin-sm 900ms linear infinite;\n}\n@keyframes spin-sm { to { transform: rotate(360deg); } }\n\n.successmark { width: 96px; height: 96px; }\n.successmark .g-mark { width: 72px; height: 72px; }\n\n/* ---------- status rows ---------- */\n\n/* Wide row, pinned to the bottom of the main screen. */\n.ledgerbar {\n  width: var(--content);\n  display: flex; align-items: center; gap: 12px;\n  padding: 20px 0 12px;\n  border-top: 1px solid var(--hairline);\n  flex-shrink: 0;\n}\n.ledgerbar .text { flex: 1 0 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }\n.ledgerbar .row-title { font-weight: 500; }\n.ledgerbar .row-sub { color: var(--text-muted); }\n.ledgerbar .btn { width: auto; height: 35px; padding: 8px 16px; border-radius: var(--radius-pill); }\n\n.chip {\n  width: 32px; height: 32px; border-radius: 99px; flex-shrink: 0;\n  background: var(--surface-icon);\n  display: flex; align-items: center; justify-content: center;\n}\n.chip.ready { background: var(--tech-blue); }\n.chip .icon { width: 16px; height: 16px; }\n.chip.sm { width: 24px; height: 24px; }\n.chip.sm .icon { width: 14px; height: 14px; }\n\n/* Narrow row used mid-operation and during setup. */\n.statusrow {\n  width: 320px; height: 52px;\n  background: var(--surface); border-radius: var(--radius-card);\n  display: flex; align-items: center; justify-content: center; gap: 12px;\n  padding: 12px 0;\n  color: var(--text-muted); font-weight: 500;\n}\n.statusrow.done { color: var(--text); }\n.statusline { display: flex; align-items: center; gap: 12px; font-weight: 500; }\n\n/* ---------- notification ---------- */\n\n.notice {\n  position: absolute; left: 0; bottom: 0; width: var(--content);\n  background: var(--warning-bg); border-radius: var(--radius-card);\n  padding: 8px 8px 8px 20px;\n  display: flex; align-items: center; gap: 12px;\n  color: var(--amber); font-weight: 500;\n}\n.notice .lines { flex: 1 0 0; min-width: 0; }\n.notice .lines p:last-child { opacity: 0.85; }\n.notice .dismiss {\n  width: 24px; height: 24px; flex-shrink: 0;\n  background: none; border: 0; padding: 0; cursor: pointer;\n}\n\n/* ---------- cards, lists, fields ---------- */\n\n.card {\n  width: var(--content);\n  background: var(--surface); border-radius: var(--radius-card);\n  padding: 12px 20px;\n  display: flex; flex-direction: column; gap: 12px;\n  position: relative;\n}\n.field { display: flex; flex-direction: column; gap: 4px; }\n.field .k { color: var(--text-muted); }\n.field .v { font-weight: 500; }\n/* Buttons do not inherit colour from their container, so an icon-only button\n   would otherwise render in the browser default and look almost black. */\n.card .copy {\n  position: absolute; right: 16px; top: 16px;\n  width: 24px; height: 24px; background: none; border: 0; padding: 0; cursor: pointer;\n  color: var(--text-muted);\n}\n.card .copy:hover { color: var(--text); }\n\n.inforow {\n  width: var(--content);\n  display: flex; align-items: flex-start; gap: 12px;\n  padding: 0 20px;\n}\n.inforow .text { flex: 1 0 0; }\n.inforow .text .k { font-weight: 500; }\n.inforow .text .s { color: var(--text-muted); }\n\n.keylist { width: var(--content); display: flex; flex-direction: column; gap: 4px; }\n.keyrow {\n  width: 100%; min-height: 66px;\n  border-radius: var(--radius-key); padding: 12px;\n  display: flex; align-items: flex-start; gap: 12px;\n  background: none; border: 0; text-align: left; cursor: pointer;\n  font-family: var(--font-ui); color: var(--text);\n}\n.keyrow.is-selected { background: var(--surface); }\n.keyrow .box { width: 24px; height: 24px; flex-shrink: 0; }\n.keyrow .info { flex: 1 0 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }\n.keyrow .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n.keyrow .name { font-size: 16px; font-weight: 500; line-height: 19px; }\n.keyrow .mail { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.badge { font-size: 14px; font-weight: 500; line-height: 17px; text-transform: uppercase; flex-shrink: 0; }\n.badge.mine { color: var(--ocean-blue); }\n.badge.new { color: var(--green); }\n\n.input {\n  width: 320px; height: 52px;\n  background: var(--surface); border: 0; border-radius: var(--radius-card);\n  padding: 12px 20px;\n  font-family: var(--font-ui); font-size: 16px; font-weight: 500; line-height: 19px;\n  color: var(--text);\n}\n.input::placeholder { color: var(--text-muted); }\n.input:focus { outline: 1px solid var(--accent-soft); }\n.inputs { display: flex; flex-direction: column; gap: 12px; }\n\n/* ---------- setup: progress, steps, consent ---------- */\n\n.progress {\n  width: 280px; height: 4px;\n  background: var(--accent-soft); border-radius: 24px;\n  overflow: hidden; display: flex; flex-shrink: 0;\n}\n.progress span { flex: 1 0 0; height: 4px; border-radius: 99px; }\n.progress span.on { background: var(--tech-blue); border-radius: 0; }\n.progress span.on.last { border-radius: 0 99px 99px 0; }\n\n.steps { width: var(--content); display: flex; flex-direction: column; gap: 12px; }\n.step { display: flex; align-items: flex-start; gap: 12px; min-height: 28px; }\n.step .num {\n  width: 28px; height: 28px; flex-shrink: 0;\n  background: var(--surface-step); border-radius: 8px;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 16px; line-height: 19px;\n}\n.step .body { padding-top: 2.5px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }\n.tag {\n  display: inline-flex; align-items: center; height: 23px; padding: 2px 9px;\n  background: var(--accent-soft); border-radius: var(--radius-pill);\n  color: var(--ocean-blue);\n}\n.note { width: var(--content); padding: 0 40px; font-size: 12px; line-height: 15px; color: var(--text-secondary); }\n\n.consent {\n  width: var(--content); background: var(--surface); border-radius: var(--radius-key);\n  padding: 12px; display: flex; align-items: flex-start; gap: 12px;\n  cursor: pointer; text-align: left; border: 0; color: var(--text); font-family: var(--font-ui);\n}\n.consent .box { width: 24px; height: 24px; flex-shrink: 0; }\n.consent .text { flex: 1 0 0; display: flex; flex-direction: column; gap: 4px; }\n.consent .text .k { font-size: 16px; font-weight: 500; line-height: 19px; }\n.consent .text .s { font-size: 16px; line-height: 19px; color: var(--text-muted); }\n\n.setup-body { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 32px; flex: 1 0 0; }\n.log {\n  width: var(--content); max-height: 180px; overflow-y: auto;\n  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n  font-size: 12px; line-height: 17px; color: var(--text-muted);\n  white-space: pre-wrap; word-break: break-word;\n}\n\n.dropzone {\n  flex: 1 0 0; width: 100%;\n  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;\n}\n.dropzone.is-over .g-ring-2 { background: rgba(255, 255, 255, 0.18); }\n.linklike { color: var(--text-secondary); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }\n\n/* ---------- utilities ----------\n   The renderer's Content-Security-Policy forbids inline style attributes, so\n   every one-off adjustment lives here as a named class instead. */\n\n.ink-accent { color: var(--ocean-blue); }\n.ink-glyph { color: rgba(255, 255, 255, 0.55); }\n.ink-glyph-strong { color: rgba(255, 255, 255, 0.6); }\n.ink-white { color: #fff; }\n\n.stack { display: flex; flex-direction: column; align-items: center; }\n.stack.w-full { width: 100%; }\n.stack.w-320 { width: 320px; }\n.stack.start { align-items: stretch; }\n.gap-12 { gap: 12px; }\n.gap-16 { gap: 16px; }\n.gap-32 { gap: 32px; }\n.w-400 { width: 400px; }\n\n/* A nav icon that floats over a centred screen instead of a heading block. */\n.nav-float { position: absolute; width: 24px; height: 24px; cursor: pointer; }\n.nav-float.tr { right: 0; top: 0; }\n.nav-float.tr-24 { right: 0; top: 24px; }\n.nav-float.tl-29 { left: 0; top: 29px; }\n.btn-float { position: absolute; left: 117px; bottom: 0; }\n\n</style>\n</head>\n<body>\n  <svg class=\"sprite\" aria-hidden=\"true\"><defs>\n    <symbol id=\"i-file\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M14 2.27V6.4c0 .56 0 .84.11 1.05.1.19.25.34.44.44.21.11.49.11 1.05.11h4.13M14 2h-4.8c-1.68 0-2.52 0-3.16.33a3 3 0 0 0-1.31 1.31C4.4 4.28 4.4 5.12 4.4 6.8v10.4c0 1.68 0 2.52.33 3.16a3 3 0 0 0 1.31 1.31c.64.33 1.48.33 3.16.33h5.6c1.68 0 2.52 0 3.16-.33a3 3 0 0 0 1.31-1.31c.33-.64.33-1.48.33-3.16V8L14 2Z\"/>\n    </symbol>\n    <symbol id=\"i-file-shield\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M14 2.27V6.4c0 .56 0 .84.11 1.05.1.19.25.34.44.44.21.11.49.11 1.05.11h4.13M20 10V8l-6-6H9.2c-1.68 0-2.52 0-3.16.33a3 3 0 0 0-1.31 1.31C4.4 4.28 4.4 5.12 4.4 6.8v10.4c0 1.68 0 2.52.33 3.16a3 3 0 0 0 1.31 1.31c.64.33 1.48.33 3.16.33H12\"/>\n      <path d=\"M17.5 13.2 21 14.6v2.9c0 2.1-1.4 3.5-3.5 4.5-2.1-1-3.5-2.4-3.5-4.5v-2.9l3.5-1.4Z\"/>\n    </symbol>\n    <symbol id=\"i-plus\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\n      <path d=\"M5 12h7m0 0h7m-7 0V5m0 7v7\"/>\n    </symbol>\n    <symbol id=\"i-check\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M2.67 7.67 6.22 11.33 13.33 4\"/>\n    </symbol>\n    <symbol id=\"i-x\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\n      <path d=\"M18 6 6 18M6 6l12 12\"/>\n    </symbol>\n    <symbol id=\"i-arrow-left\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M19 12H5m0 0 7 7m-7-7 7-7\"/>\n    </symbol>\n    <symbol id=\"i-alert\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M12 9v4m0 4h.01M10.6 3.8 2.4 18a1.6 1.6 0 0 0 1.4 2.4h16.4a1.6 1.6 0 0 0 1.4-2.4L13.4 3.8a1.6 1.6 0 0 0-2.8 0Z\"/>\n    </symbol>\n    <symbol id=\"i-shield-plus\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M12 8v6m-3-3h6m-3-9 7 3v5c0 4.2-2.8 7.2-7 9-4.2-1.8-7-4.8-7-9V5l7-3Z\"/>\n    </symbol>\n    <symbol id=\"i-link-broken\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M9 17H7A5 5 0 0 1 7 7h2m6 10h2a5 5 0 0 0 0-10h-2M12 2v3m0 14v3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1\"/>\n    </symbol>\n    <symbol id=\"i-pin\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M7 10V7a5 5 0 0 1 9.6-2M5 10h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z\"/>\n    </symbol>\n    <symbol id=\"i-hourglass\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M6 2h12M6 22h12M8 2v4.2c0 .5.2 1 .6 1.4L12 11l3.4-3.4c.4-.4.6-.9.6-1.4V2M8 22v-4.2c0-.5.2-1 .6-1.4L12 13l3.4 3.4c.4.4.6.9.6 1.4V22\"/>\n    </symbol>\n    <symbol id=\"i-copy\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M8 8V5.2c0-1.1 0-1.7.2-2.1a2 2 0 0 1 .9-.9c.4-.2 1-.2 2.1-.2h7.6c1.1 0 1.7 0 2.1.2a2 2 0 0 1 .9.9c.2.4.2 1 .2 2.1v7.6c0 1.1 0 1.7-.2 2.1a2 2 0 0 1-.9.9c-.4.2-1 .2-2.1.2H16\"/>\n      <path d=\"M5.2 8h7.6c1.1 0 1.7 0 2.1.2a2 2 0 0 1 .9.9c.2.4.2 1 .2 2.1v7.6c0 1.1 0 1.7-.2 2.1a2 2 0 0 1-.9.9c-.4.2-1 .2-2.1.2H5.2c-1.1 0-1.7 0-2.1-.2a2 2 0 0 1-.9-.9c-.2-.4-.2-1-.2-2.1v-7.6c0-1.1 0-1.7.2-2.1a2 2 0 0 1 .9-.9c.4-.2 1-.2 2.1-.2Z\"/>\n    </symbol>\n    <symbol id=\"i-key\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M21 2 19 4m-2 2 2-2m0 0 2 2-4 4-2-2m-2 2a5 5 0 1 1-7 7 5 5 0 0 1 7-7Zm0 0 4-4\"/>\n    </symbol>\n    <symbol id=\"i-box-off\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\"0.5\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <rect x=\"1.75\" y=\"1.75\" width=\"20.5\" height=\"20.5\" rx=\"4.8\"/>\n    </symbol>\n    <symbol id=\"i-box-on\" viewBox=\"0 0 24 24\" fill=\"none\">\n      <rect x=\"1\" y=\"1\" width=\"22\" height=\"22\" rx=\"4.8\" fill=\"#325FEB\"/>\n      <path d=\"M7.9 12 10.6 15.1 16.1 8.9\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    </symbol>\n  </defs></svg>\n<div class=\"window\">\n  <div class=\"titlebar\">\n    <div class=\"traffic\">\n      <span class=\"close\" id=\"win-close\"></span><span class=\"min\" id=\"win-min\"></span><span class=\"zoom\"></span>\n    </div>\n    <div class=\"titlebar-title\">Sealbox</div>\n  </div>\n\n  <div class=\"screens\" id=\"screens\">\n\n    <!-- ============ Main page ============ -->\n    <section class=\"screen\" id=\"screen-drop\">\n      <div class=\"topbar\">\n        <button class=\"linkbtn\" id=\"btn-import-key\">\n          <svg class=\"icon ink-accent\"><use href=\"#i-plus\"/></svg>\n          Import public key\n        </button>\n      </div>\n      <div class=\"dropzone\" id=\"dropzone\">\n        <div class=\"glow dropglow\">\n          <div class=\"g-core\"></div><div class=\"g-ring-1\"></div><div class=\"g-ring-2\"></div><div class=\"g-inner\"></div>\n          <div class=\"g-mark\"><svg width=\"48\" height=\"48\" class=\"ink-glyph\"><use href=\"#i-file\"/></svg></div>\n        </div>\n        <h1 class=\"title\">Drop a file here</h1>\n        <p class=\"subtitle\"><span class=\"linklike\" id=\"btn-choose\">or choose a file</span></p>\n      </div>\n      <div class=\"ledgerbar\" id=\"ledgerbar\">\n        <div class=\"chip\" id=\"ledger-chip\"><svg class=\"icon\"><use href=\"#i-hourglass\"/></svg></div>\n        <div class=\"text\">\n          <div class=\"row-title\" id=\"ledger-title\">Checking Ledger…</div>\n          <div class=\"row-sub\" id=\"ledger-sub\" hidden></div>\n        </div>\n        <button class=\"btn primary\" id=\"ledger-action\" hidden></button>\n      </div>\n    </section>\n\n    <!-- ============ Encrypt: choose recipients ============ -->\n    <section class=\"screen shell-split\" id=\"screen-keys\">\n      <div class=\"setup-body gap-32\">\n        <div class=\"fileinfo\">\n          <span class=\"filepill\" id=\"keys-file\"></span>\n          <h1 class=\"title\">Choose one or more keys</h1>\n        </div>\n        <div class=\"keylist\" id=\"keylist\"></div>\n      </div>\n      <div class=\"footer\">\n        <button class=\"btn primary\" id=\"btn-encrypt\">Encrypt</button>\n        <button class=\"linkbtn\" id=\"btn-import-key-2\">\n          <svg class=\"icon ink-accent\"><use href=\"#i-plus\"/></svg>\n          Import public key\n        </button>\n      </div>\n    </section>\n\n    <!-- ============ Encrypt: nothing to encrypt to ============ -->\n    <section class=\"screen shell-split\" id=\"screen-nokeys\">\n      <div class=\"fileinfo\">\n        <span class=\"filepill\" id=\"nokeys-file\"></span>\n        <div class=\"heading\">\n          <h1 class=\"title\">No public keys yet</h1>\n          <p class=\"subtitle\">Add a public key to encrypt this file.</p>\n          <svg class=\"nav close\" id=\"nokeys-close\"><use href=\"#i-x\"/></svg>\n        </div>\n      </div>\n      <div class=\"footer\">\n        <button class=\"btn primary\" id=\"btn-import-key-3\">Import public key</button>\n        <button class=\"linkbtn\" id=\"btn-setup-ledger\">\n          <svg class=\"icon ink-accent\"><use href=\"#i-key\"/></svg>\n          Set up my Ledger\n        </button>\n      </div>\n    </section>\n\n    <!-- ============ Working (encrypting / decrypting) ============ -->\n    <section class=\"screen shell-centre\" id=\"screen-working\">\n      <div class=\"glow spinner\"><div class=\"g-core\"></div><div class=\"ring\"></div></div>\n      <span class=\"filepill\" id=\"working-file\"></span>\n      <h1 class=\"title\" id=\"working-title\">Encrypting file…</h1>\n      <p class=\"subtitle plain\" id=\"working-sub\"></p>\n    </section>\n\n    <!-- ============ Done ============ -->\n    <section class=\"screen shell-success\" id=\"screen-done\">\n      <div class=\"stack w-full gap-12\">\n        <div class=\"glow successmark\">\n          <div class=\"g-core\"></div><div class=\"g-inner\"></div>\n          <div class=\"g-mark\"><svg width=\"72\" height=\"72\"><use href=\"#i-file-shield\"/></svg></div>\n        </div>\n        <span class=\"filepill\" id=\"done-file\"></span>\n        <h1 class=\"title\" id=\"done-title\">File encrypted</h1>\n        <p class=\"subtitle plain\" id=\"done-sub\"></p>\n      </div>\n      <div class=\"btn-stack\">\n        <button class=\"btn primary\" id=\"btn-reveal\">Show in Finder</button>\n        <button class=\"btn secondary raised\" id=\"btn-trash\">Move original to Trash</button>\n        <p class=\"caption\" id=\"done-caption\">The original file is still on your Mac.</p>\n      </div>\n      <svg class=\"nav-float tr\" id=\"done-close\"><use href=\"#i-x\"/></svg>\n    </section>\n\n    <!-- ============ Waiting for the device mid-operation ============ -->\n    <section class=\"screen shell-top\" id=\"screen-device\">\n      <div class=\"fileinfo\">\n        <span class=\"filepill\" id=\"device-file\"></span>\n        <div class=\"heading\">\n          <h1 class=\"title\" id=\"device-title\">Connect your Ledger</h1>\n          <p class=\"subtitle\" id=\"device-sub\" hidden></p>\n          <svg class=\"nav close\" id=\"device-close\"><use href=\"#i-x\"/></svg>\n        </div>\n      </div>\n      <div class=\"statusrow\" id=\"device-status\">\n        <span class=\"ring-sm\" id=\"device-ring\"></span>\n        <span class=\"chip ready sm\" id=\"device-check\" hidden><svg class=\"icon\"><use href=\"#i-check\"/></svg></span>\n        <span id=\"device-status-text\">Waiting for Ledger…</span>\n      </div>\n      <button class=\"btn primary\" id=\"device-setup\" hidden>Set up Sealbox</button>\n    </section>\n\n    <!-- ============ Import a public key ============ -->\n    <section class=\"screen shell-centre\" id=\"screen-import\">\n      <svg class=\"nav-float tl-29\" id=\"import-back\"><use href=\"#i-arrow-left\"/></svg>\n      <div class=\"glow dropglow\">\n        <div class=\"g-core\"></div><div class=\"g-ring-1\"></div><div class=\"g-ring-2\"></div><div class=\"g-inner\"></div>\n        <div class=\"g-mark\"><svg width=\"48\" height=\"48\" class=\"ink-glyph\"><use href=\"#i-file\"/></svg></div>\n      </div>\n      <h1 class=\"title\">Drop a public key file here<br /><span class=\"linklike\" id=\"btn-choose-key\">or choose a file</span></h1>\n      <p class=\"subtitle\">OpenPGP public key (.asc)</p>\n    </section>\n\n    <!-- ============ Review an imported key ============ -->\n    <section class=\"screen shell-split\" id=\"screen-review\">\n      <div class=\"setup-body gap-32\">\n        <div class=\"heading\">\n          <h1 class=\"title\">Add this public key?</h1>\n          <svg class=\"nav back\" id=\"review-back\"><use href=\"#i-arrow-left\"/></svg>\n          <svg class=\"nav close\" id=\"review-close\"><use href=\"#i-x\"/></svg>\n        </div>\n        <div class=\"stack start w-full gap-16\">\n          <div class=\"card\">\n            <div class=\"field\"><div class=\"v\" id=\"review-name\"></div><div class=\"k\" id=\"review-mail\"></div></div>\n            <div class=\"field\"><div class=\"v\" id=\"review-fpr\"></div><div class=\"k\">Fingerprint</div></div>\n          </div>\n          <div class=\"inforow\">\n            <div class=\"chip\"><svg class=\"icon\"><use href=\"#i-alert\"/></svg></div>\n            <div class=\"text\">Files encrypted for this key can be decrypted by its owner.</div>\n          </div>\n        </div>\n      </div>\n      <button class=\"btn primary\" id=\"btn-add-key\">Add public key</button>\n    </section>\n\n    <!-- ============ Setup 1 — intro ============ -->\n    <section class=\"screen shell-centre\" id=\"s-intro\">\n      <div class=\"glow dropglow\">\n        <div class=\"g-core\"></div><div class=\"g-ring-1\"></div><div class=\"g-ring-2\"></div><div class=\"g-inner\"></div>\n        <div class=\"g-mark\"><svg width=\"56\" height=\"56\" class=\"ink-glyph-strong\"><use href=\"#i-shield-plus\"/></svg></div>\n      </div>\n      <h1 class=\"title\">Set up your Ledger</h1>\n      <p class=\"subtitle w-400\">Prepare your Mac and create a key for encrypting and decrypting files.</p>\n      <button class=\"btn primary btn-float\" id=\"s-intro-next\">Start setup</button>\n      <svg class=\"nav-float tr-24\" id=\"s-intro-close\"><use href=\"#i-x\"/></svg>\n    </section>\n\n    <!-- ============ Setup 2 — prepare the Mac ============ -->\n    <section class=\"screen shell-split\" id=\"s-prepare\">\n      <div class=\"setup-body\">\n        <div class=\"progress\" id=\"p-prepare\"></div>\n        <div class=\"heading\">\n          <h1 class=\"title\" id=\"s-prepare-title\">Prepare your Mac</h1>\n          <p class=\"subtitle\" id=\"s-prepare-sub\">Install the tools needed to work with your Ledger.</p>\n          <svg class=\"nav close\" id=\"s-prepare-close\"><use href=\"#i-x\"/></svg>\n        </div>\n        <pre class=\"log\" id=\"s-prepare-log\" hidden></pre>\n      </div>\n      <button class=\"btn primary\" id=\"s-prepare-next\">Prepare Mac</button>\n    </section>\n\n    <!-- ============ Setup 2 — it did not work ============ -->\n    <section class=\"screen shell-centre gap-32\" id=\"s-prepare-failed\">\n      <div class=\"heading gap-12\">\n        <h1 class=\"title\">Couldn’t prepare your Mac</h1>\n        <p class=\"subtitle\" id=\"s-failed-sub\">Something went wrong during setup.</p>\n      </div>\n      <div class=\"btn-stack\">\n        <button class=\"btn primary\" id=\"s-failed-retry\">Try again</button>\n        <button class=\"btn secondary raised\" id=\"s-failed-details\">Show details</button>\n      </div>\n      <pre class=\"log\" id=\"s-failed-log\" hidden></pre>\n    </section>\n\n    <!-- ============ Setup 3 — install OpenPGP ============ -->\n    <section class=\"screen shell-split\" id=\"s-openpgp\">\n      <div class=\"setup-body\">\n        <div class=\"progress\" id=\"p-openpgp\"></div>\n        <div class=\"heading\">\n          <h1 class=\"title\">Install OpenPGP on Ledger</h1>\n          <svg class=\"nav back\" id=\"s-openpgp-back\"><use href=\"#i-arrow-left\"/></svg>\n          <svg class=\"nav close\" id=\"s-openpgp-close\"><use href=\"#i-x\"/></svg>\n        </div>\n        <div class=\"steps\">\n          <div class=\"step\"><span class=\"num\">1</span><span class=\"body\">Open <span class=\"tag\">Ledger Live</span></span></div>\n          <div class=\"step\"><span class=\"num\">2</span><span class=\"body\">Open Settings → <span class=\"tag\">Experimental features</span></span></div>\n          <div class=\"step\"><span class=\"num\">3</span><span class=\"body\">Turn on <span class=\"tag\">Developer mode</span></span></div>\n          <div class=\"step\"><span class=\"num\">4</span><span class=\"body\">Open <span class=\"tag\">My Ledger</span></span></div>\n          <div class=\"step\"><span class=\"num\">5</span><span class=\"body\">Find <span class=\"tag\">OpenPGP</span> and install it</span></div>\n        </div>\n        <p class=\"note\">If you see two OpenPGP apps, choose the one without “XL”.</p>\n      </div>\n      <button class=\"btn primary\" id=\"s-openpgp-next\">OpenPGP installed</button>\n    </section>\n\n    <!-- ============ Setup 4 — Seed mode ============ -->\n    <section class=\"screen shell-split\" id=\"s-seed\">\n      <div class=\"setup-body\">\n        <div class=\"progress\" id=\"p-seed\"></div>\n        <div class=\"heading\">\n          <h1 class=\"title\">Enable Seed mode</h1>\n          <p class=\"subtitle\">Seed mode lets you restore your key after a Ledger or OpenPGP update.</p>\n          <svg class=\"nav back\" id=\"s-seed-back\"><use href=\"#i-arrow-left\"/></svg>\n          <svg class=\"nav close\" id=\"s-seed-close\"><use href=\"#i-x\"/></svg>\n        </div>\n        <div class=\"steps\">\n          <div class=\"step\"><span class=\"num\">1</span><span class=\"body\">Quit Ledger Live</span></div>\n          <div class=\"step\"><span class=\"num\">2</span><span class=\"body\">Open <span class=\"tag\">OpenPGP</span> on your Ledger</span></div>\n          <div class=\"step\"><span class=\"num\">3</span><span class=\"body\">Open Settings → <span class=\"tag\">Seed mode</span></span></div>\n          <div class=\"step\"><span class=\"num\">4</span><span class=\"body\">Turn it On</span></div>\n        </div>\n        <button class=\"consent\" id=\"s-seed-consent\">\n          <svg class=\"box\"><use href=\"#i-box-off\" id=\"s-seed-box\"/></svg>\n          <span class=\"text\">\n            <span class=\"k\">I understand that Seed mode must stay enabled</span>\n            <span class=\"s\">If it’s turned off, I may lose access to encrypted files after an update.</span>\n          </span>\n        </button>\n      </div>\n      <button class=\"btn primary\" id=\"s-seed-next\" disabled>Seed mode enabled</button>\n    </section>\n\n    <!-- ============ Setup 5 — connect the Ledger ============ -->\n    <section class=\"screen shell-split\" id=\"s-connect\">\n      <div class=\"setup-body\">\n        <div class=\"progress\" id=\"p-connect\"></div>\n        <div class=\"heading\">\n          <h1 class=\"title\">Connect your Ledger</h1>\n          <p class=\"subtitle\" id=\"s-connect-sub\">Connect and unlock your Ledger, then open OpenPGP.<br />Make sure Ledger Live is closed.</p>\n          <svg class=\"nav back\" id=\"s-connect-back\"><use href=\"#i-arrow-left\"/></svg>\n          <svg class=\"nav close\" id=\"s-connect-close\"><use href=\"#i-x\"/></svg>\n        </div>\n        <div class=\"statusrow\" id=\"s-connect-status\">\n          <span class=\"ring-sm\" id=\"s-connect-ring\"></span>\n          <span class=\"chip ready sm\" id=\"s-connect-check\" hidden><svg class=\"icon\"><use href=\"#i-check\"/></svg></span>\n          <span id=\"s-connect-text\">Waiting for Ledger…</span>\n        </div>\n      </div>\n      <button class=\"btn primary\" id=\"s-connect-next\" hidden>Continue</button>\n    </section>\n\n    <!-- ============ Setup 6 — create the key ============ -->\n    <section class=\"screen shell-split\" id=\"s-key\">\n      <div class=\"setup-body\">\n        <div class=\"progress\" id=\"p-key\"></div>\n        <div class=\"heading\">\n          <h1 class=\"title\">Create your encryption key</h1>\n          <p class=\"subtitle\">Your key will be created on your Ledger.</p>\n          <svg class=\"nav back\" id=\"s-key-back\"><use href=\"#i-arrow-left\"/></svg>\n          <svg class=\"nav close\" id=\"s-key-close\"><use href=\"#i-x\"/></svg>\n        </div>\n        <div class=\"inputs\">\n          <input class=\"input\" id=\"s-key-name\" placeholder=\"Name\" spellcheck=\"false\" />\n          <input class=\"input\" id=\"s-key-mail\" placeholder=\"Email\" spellcheck=\"false\" />\n        </div>\n      </div>\n      <div class=\"footer\">\n        <button class=\"btn primary\" id=\"s-key-next\">Create key</button>\n        <div class=\"statusline\" id=\"s-key-status\">\n          <span class=\"chip ready sm\"><svg class=\"icon\"><use href=\"#i-check\"/></svg></span>\n          <span>Ledger ready</span>\n        </div>\n      </div>\n    </section>\n\n    <!-- ============ Setup 7 — the device is creating it ============ -->\n    <section class=\"screen shell-split\" id=\"s-creating\">\n      <div class=\"setup-body\">\n        <div class=\"progress\" id=\"p-creating\"></div>\n        <div class=\"heading\">\n          <h1 class=\"title\" id=\"s-creating-title\">Finish on your Ledger</h1>\n          <p class=\"subtitle\">Follow the prompts on your Ledger screen to create the key. Enter the PIN when asked and keep the device connected.</p>\n        </div>\n      </div>\n      <div class=\"statusline\" id=\"s-creating-status\" hidden>\n        <span class=\"chip ready sm\"><svg class=\"icon\"><use href=\"#i-check\"/></svg></span>\n        <span>Key created</span>\n      </div>\n    </section>\n\n    <!-- ============ Setup 8 — recovery details ============ -->\n    <section class=\"screen shell-split\" id=\"s-recovery\">\n      <div class=\"setup-body\">\n        <div class=\"progress\" id=\"p-recovery\"></div>\n        <div class=\"heading\">\n          <h1 class=\"title\">Save your recovery details</h1>\n          <p class=\"subtitle\">You’ll need these details if your key has to be restored.</p>\n          <svg class=\"nav close\" id=\"s-recovery-close\"><use href=\"#i-x\"/></svg>\n        </div>\n        <div class=\"card\">\n          <button class=\"copy\" id=\"s-recovery-copy\" title=\"Copy\"><svg width=\"24\" height=\"24\"><use href=\"#i-copy\"/></svg></button>\n          <div class=\"field\"><div class=\"k\">Timestamp</div><div class=\"v\" id=\"rec-time\"></div></div>\n          <div class=\"field\"><div class=\"k\">Name</div><div class=\"v\" id=\"rec-name\"></div></div>\n          <div class=\"field\"><div class=\"k\">Email</div><div class=\"v\" id=\"rec-mail\"></div></div>\n          <div class=\"field\"><div class=\"k\">Key type</div><div class=\"v\" id=\"rec-type\"></div></div>\n        </div>\n        <div class=\"inforow\">\n          <div class=\"chip\"><svg class=\"icon\"><use href=\"#i-alert\"/></svg></div>\n          <div class=\"text\">\n            <div class=\"k\">Your Ledger recovery phrase is separate</div>\n            <div class=\"s\">These recovery details do not contain your 24-word recovery phrase.</div>\n          </div>\n        </div>\n      </div>\n      <button class=\"btn primary\" id=\"s-recovery-next\">Save recovery details</button>\n    </section>\n\n    <!-- ============ Setup 9 — done ============ -->\n    <section class=\"screen shell-centre gap-32\" id=\"s-done\">\n      <div class=\"stack w-320 gap-12\">\n        <div class=\"glow successmark\">\n          <div class=\"g-core\"></div><div class=\"g-inner\"></div>\n          <div class=\"g-mark\"><svg width=\"72\" height=\"72\"><use href=\"#i-file-shield\"/></svg></div>\n        </div>\n        <h1 class=\"title\">Setup complete</h1>\n        <p class=\"subtitle\">Your encryption key is ready.<br />You can encrypt files now. Connect your Ledger when you need to decrypt them.</p>\n      </div>\n      <button class=\"btn primary\" id=\"s-done-next\">Go to Sealbox</button>\n    </section>\n\n    <!-- One notification bar, shared by every screen. -->\n    <div class=\"notice\" id=\"notice\" hidden>\n      <div class=\"lines\"><p id=\"notice-1\"></p><p id=\"notice-2\" hidden></p></div>\n      <button class=\"dismiss\" id=\"notice-x\"><svg width=\"24\" height=\"24\" class=\"ink-white\"><use href=\"#i-x\"/></svg></button>\n    </div>\n  </div>\n</div>\n<script>\n'use strict';\n/**\n * Every string the interface can show about the device or the setup flow.\n *\n * This lives apart from renderer.js for one reason: it can then be loaded by a\n * test in Node as well as by the window, so \"does each device state actually\n * have something to say to the user?\" is a question a test can answer instead\n * of a person having to click through eight states by hand.\n *\n * The wording comes from the design file, verbatim.\n */\n\n// Wrapped in a function on purpose: index.html loads this as a classic script\n// alongside renderer.js, so both share one global scope. A top-level `const\n// DEVICE_ROWS` here would collide with any binding of the same name over there\n// and Electron would refuse to parse the other file entirely — the same failure\n// that once shipped as a blank window.\n(function () {\n  const DEVICE_ROWS = {\n  'no-gpg': {\n    icon: 'shield-plus',\n    title: 'Ledger not set up',\n    sub: 'Set up your Ledger to create and use your key.',\n    action: 'Set up',\n  },\n  checking: {\n    icon: 'hourglass',\n    title: 'Checking Ledger…',\n  },\n  disconnected: {\n    icon: 'link-broken',\n    title: 'Ledger disconnected',\n    sub: 'Connect your Ledger when you need it.',\n    action: 'Connect',\n  },\n  closed: {\n    icon: 'alert',\n    title: 'Open OpenPGP',\n    sub: 'Open the OpenPGP app on your Ledger.',\n  },\n  'ledger-live': {\n    icon: 'alert',\n    title: 'Quit Ledger Live',\n    sub: 'Ledger Live is using your Ledger.',\n    action: 'Check again',\n  },\n  ready: {\n    icon: 'check',\n    title: 'Ledger ready',\n    action: 'Details',\n    secondary: true,\n    ready: true,\n  },\n  'no-key': {\n    icon: 'pin',\n    title: 'Key not found',\n    sub: 'Restore your key to access encrypted files.',\n    action: 'Restore key',\n  },\n  error: {\n    icon: 'alert',\n    title: 'Ledger unavailable',\n    sub: 'Sealbox couldn’t connect to your Ledger.',\n    action: 'Try again',\n  },\n  };\n\n  /** The same states, said differently when an operation is already under way. */\n  const DEVICE_SCREEN = {\n  'no-gpg': {\n    title: 'Finish setting up',\n    sub: 'Sealbox needs a few tools before it can talk to your Ledger.',\n    status: 'Waiting for Ledger…',\n  },\n  checking: { title: 'Connect your Ledger', status: 'Checking Ledger…' },\n  disconnected: { title: 'Connect your Ledger', status: 'Waiting for Ledger…' },\n  closed: {\n    title: 'Open OpenPGP',\n    sub: 'Open the OpenPGP app on your Ledger.',\n    status: 'Waiting for Ledger…',\n  },\n  'ledger-live': {\n    title: 'Connect your Ledger',\n    status: 'Waiting for Ledger…',\n    note: 'Ledger Live is using your Ledger',\n  },\n  ready: { title: 'Connect your Ledger', status: 'Ledger ready', ready: true },\n  'no-key': {\n    title: 'Connect your Ledger',\n    status: 'Ledger ready',\n    ready: true,\n    note: 'This Ledger can’t decrypt the file',\n    note2: 'Connect a Ledger that holds one of the required keys',\n  },\n  error: {\n    title: 'Connect your Ledger',\n    status: 'Waiting for Ledger…',\n    note: 'Reconnect your Ledger to continue.',\n  },\n  };\n\n  /**\n   * The setup ladder. `screen` is the id in index.html, `bar` is how many of the\n   * seven segments are filled — steps without a bar are the ones the design shows\n   * without one (the welcome, the failure, the finish).\n   */\n  const SETUP_STEPS = [\n  { step: 1, screen: 's-intro', title: 'Set up your Ledger' },\n  { step: 2, screen: 's-prepare', title: 'Prepare your Mac', bar: 1 },\n  { step: 3, screen: 's-openpgp', title: 'Install OpenPGP on Ledger', bar: 2 },\n  { step: 4, screen: 's-seed', title: 'Enable Seed mode', bar: 3 },\n  { step: 5, screen: 's-connect', title: 'Connect your Ledger', bar: 4 },\n  { step: 6, screen: 's-key', title: 'Create your encryption key', bar: 5 },\n  { step: 7, screen: 's-creating', title: 'Finish on your Ledger', bar: 6 },\n  { step: 8, screen: 's-recovery', title: 'Save your recovery details', bar: 7 },\n  { step: 9, screen: 's-done', title: 'Setup complete' },\n  ];\n\n  const SETUP_TOTAL = 7;\n\n  // Loaded both as a plain script in the window and as a module in tests.\n  const exported = { DEVICE_ROWS, DEVICE_SCREEN, SETUP_STEPS, SETUP_TOTAL };\n  if (typeof window !== 'undefined') window.SEALBOX_COPY = exported;\n  if (typeof module !== 'undefined' && module.exports) module.exports = exported;\n}());\n\n<\/script>\n<script>\n'use strict';\n/*\n * Sealbox — interface logic.\n *\n * The layout lives in index.html and styles.css; this file only decides which\n * screen is visible and what it says. Every screen is a <section class=\"screen\">\n * and exactly one of them carries .is-active at any time.\n *\n * NOT `const api`: preload.js exposes a global `window.api`, and a top-level\n * const of the same name collides with that non-configurable global property.\n * Electron then fails to parse this whole file and nothing runs at all, while a\n * browser preview (where window.api is absent) works fine — which is exactly how\n * that bug survived until the app was launched for real.\n */\n\nconst bridge = window.api || demoApi();\n\nconst $ = (id) => document.getElementById(id);\nconst on = (id, event, fn) => { const el = $(id); if (el) el.addEventListener(event, fn); };\n\nconst state = {\n  screen: 'screen-drop',\n  env: null,          // last status from the main process\n  file: null,         // the file being encrypted or decrypted\n  keys: [],           // public keys we can encrypt to\n  selected: new Set(),\n  pendingKey: null,   // a public key file waiting to be confirmed\n  result: null,       // { outputPath, sourcePath, kind }\n  setupStep: 0,\n  seedAcknowledged: false,\n  recovery: null,\n  waitTimer: null,\n  afterDevice: null,  // what to run once the device becomes ready\n};\n\n/* ---------- screens ---------- */\n\nfunction show(id) {\n  document.querySelectorAll('.screen').forEach((el) => el.classList.toggle('is-active', el.id === id));\n  state.screen = id;\n  hideNotice();\n}\n\nfunction notice(line1, line2) {\n  $('notice-1').textContent = line1;\n  const second = $('notice-2');\n  second.textContent = line2 || '';\n  second.hidden = !line2;\n  $('notice').hidden = false;\n}\nfunction hideNotice() { $('notice').hidden = true; }\n\n/* ---------- small helpers ---------- */\n\nfunction humanSize(bytes) {\n  if (!Number.isFinite(bytes)) return '';\n  if (bytes < 1024) return `${bytes} B`;\n  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;\n  if (bytes < 1024 * 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`;\n  return `${(bytes / 1024 / 1024 / 1024).toFixed(1)} GB`;\n}\n\n// The file pill: icon, name, a dot, and the size. The dot and size are dropped\n// when there is no size to show, exactly as in the design.\nfunction fillPill(el, name, size) {\n  el.textContent = '';\n  const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n  icon.setAttribute('class', 'icon');\n  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');\n  use.setAttribute('href', '#i-file');\n  icon.appendChild(use);\n  el.appendChild(icon);\n\n  const label = document.createElement('span');\n  label.className = 'name';\n  label.textContent = name;\n  el.appendChild(label);\n\n  if (size) {\n    const dot = document.createElement('span');\n    dot.className = 'dot';\n    el.appendChild(dot);\n    const s = document.createElement('span');\n    s.textContent = size;\n    el.appendChild(s);\n  }\n}\n\nfunction setProgress(id, filled, total) {\n  const bar = $(id);\n  if (!bar) return;\n  bar.textContent = '';\n  for (let i = 0; i < total; i += 1) {\n    const seg = document.createElement('span');\n    if (i < filled) {\n      seg.className = i === filled - 1 && filled < total ? 'on last' : 'on';\n    }\n    bar.appendChild(seg);\n  }\n}\n\nfunction icon(el, name) {\n  el.innerHTML = '';\n  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n  svg.setAttribute('class', 'icon');\n  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');\n  use.setAttribute('href', `#i-${name}`);\n  svg.appendChild(use);\n  el.appendChild(svg);\n}\n\n/* ---------- device status ---------- */\n\n// The wording for every device state and setup step lives in copy.js, so a\n// test can check that no state is left without something to say.\nconst COPY = (window.SEALBOX_COPY || require('./copy.js'));\nconst DEVICE_ROWS = COPY.DEVICE_ROWS;\n\nfunction paintLedgerBar(deviceState) {\n  const row = DEVICE_ROWS[deviceState] || DEVICE_ROWS.error;\n  const chip = $('ledger-chip');\n  chip.classList.toggle('ready', Boolean(row.ready));\n  icon(chip, row.icon);\n  $('ledger-title').textContent = row.title;\n  const sub = $('ledger-sub');\n  sub.textContent = row.sub || '';\n  sub.hidden = !row.sub;\n  const action = $('ledger-action');\n  action.hidden = !row.action;\n  action.textContent = row.action || '';\n  action.className = row.secondary ? 'btn secondary' : 'btn primary';\n}\n\nasync function refreshStatus() {\n  const res = await bridge.status();\n  if (!res || !res.ok) return null;\n  state.env = res.value;\n  state.keys = res.value.keys || [];\n  paintLedgerBar(res.value.device);\n  return res.value;\n}\n\nconst DEVICE_SCREEN = COPY.DEVICE_SCREEN;\n\nfunction paintDeviceScreen(deviceState) {\n  const row = DEVICE_SCREEN[deviceState] || DEVICE_SCREEN.error;\n  fillPill($('device-file'), state.file.name, humanSize(state.file.size));\n  $('device-title').textContent = row.title;\n  const sub = $('device-sub');\n  sub.textContent = row.sub || '';\n  sub.hidden = !row.sub;\n  $('device-status-text').textContent = row.status;\n  $('device-ring').hidden = Boolean(row.ready);\n  $('device-check').hidden = !row.ready;\n  $('device-status').classList.toggle('done', Boolean(row.ready));\n  // Waiting is fine when the fix is physical — plug it in, open the app. When\n  // the machine itself is not ready there is nothing to wait for, so offer the\n  // guide instead of leaving a spinner running forever.\n  $('device-setup').hidden = deviceState !== 'no-gpg';\n  show('screen-device');\n  if (row.note) notice(row.note, row.note2);\n}\n\n/* Wait for the device, then run `next`. Polls, because a Ledger appears and\n   disappears without telling anyone. */\nfunction waitForDevice(next) {\n  state.afterDevice = next;\n  const tick = async () => {\n    const env = await refreshStatus();\n    if (!env) return;\n    if (env.device === 'ready') {\n      stopWaiting();\n      const run = state.afterDevice;\n      state.afterDevice = null;\n      if (run) run();\n      return;\n    }\n    if (state.screen === 'screen-device') paintDeviceScreen(env.device);\n  };\n  paintDeviceScreen(state.env ? state.env.device : 'disconnected');\n  stopWaiting();\n  state.waitTimer = setInterval(tick, 1500);\n}\nfunction stopWaiting() { if (state.waitTimer) { clearInterval(state.waitTimer); state.waitTimer = null; } }\n\n/* ---------- the main flow ---------- */\n\nasync function accept(filePath) {\n  hideNotice();\n  const res = await bridge.inspect(filePath);\n  if (!res.ok) return notice('Sealbox could not read this file', res.error);\n  const info = res.value;\n  state.file = { path: filePath, name: info.name, size: info.size, encryption: info.encryption, keyIds: info.keyIds };\n\n  if (info.isDirectory) return notice('Folders are not supported yet', 'Compress it into an archive first');\n\n  if (info.encryption === 'password') {\n    return notice('This file is protected by a password', 'Sealbox opens files locked with a Ledger only');\n  }\n  if (info.encryption === 'publicKey') return startDecrypt();\n  return startEncrypt();\n}\n\n/* ---------- encrypting ---------- */\n\nasync function startEncrypt() {\n  const env = await refreshStatus();\n  if (!env) return;\n  if (!state.keys.length) {\n    fillPill($('nokeys-file'), state.file.name, humanSize(state.file.size));\n    return show('screen-nokeys');\n  }\n  state.selected = new Set(state.keys.filter((k) => k.mine).map((k) => k.id));\n  if (!state.selected.size) state.selected.add(state.keys[0].id);\n  paintKeyList();\n  show('screen-keys');\n}\n\nfunction paintKeyList() {\n  fillPill($('keys-file'), state.file.name, humanSize(state.file.size));\n  const list = $('keylist');\n  list.textContent = '';\n\n  state.keys.forEach((key) => {\n    const row = document.createElement('button');\n    row.className = 'keyrow' + (state.selected.has(key.id) ? ' is-selected' : '');\n    row.dataset.id = key.id;\n\n    const box = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n    box.setAttribute('class', 'box');\n    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');\n    use.setAttribute('href', state.selected.has(key.id) ? '#i-box-on' : '#i-box-off');\n    box.appendChild(use);\n    row.appendChild(box);\n\n    const info = document.createElement('span');\n    info.className = 'info';\n    const line = document.createElement('span');\n    line.className = 'line';\n    const name = document.createElement('span');\n    name.className = 'name';\n    name.textContent = key.name || key.email || key.fingerprint;\n    line.appendChild(name);\n    if (key.mine || key.isNew) {\n      const badge = document.createElement('span');\n      badge.className = 'badge ' + (key.mine ? 'mine' : 'new');\n      badge.textContent = key.mine ? 'Your key' : 'New';\n      line.appendChild(badge);\n    }\n    info.appendChild(line);\n    const mail = document.createElement('span');\n    mail.className = 'mail';\n    mail.textContent = key.email || key.fingerprint;\n    info.appendChild(mail);\n    row.appendChild(info);\n\n    row.addEventListener('click', () => {\n      if (state.selected.has(key.id)) state.selected.delete(key.id);\n      else state.selected.add(key.id);\n      paintKeyList();\n    });\n    list.appendChild(row);\n  });\n\n  const count = state.selected.size;\n  const button = $('btn-encrypt');\n  button.disabled = count === 0;\n  button.textContent = count === 1 ? 'Encrypt for 1 key' : `Encrypt for ${count} keys`;\n}\n\nfunction runEncrypt() {\n  const recipients = [...state.selected];\n  const mine = state.keys.find((k) => k.mine);\n  // Signing is what routes the operation through the device. Without a key of\n  // our own there is nothing to sign with, so we encrypt without a signature\n  // and say so on the result screen.\n  const signer = mine && mine.onCard ? mine.id : null;\n\n  const run = async () => {\n    working('Encrypting file…', '');\n    const res = await bridge.encryptTo(state.file.path, recipients, signer);\n    if (!res.ok) return failedOperation(res.error);\n    state.result = { outputPath: res.value.outputPath, name: res.value.name, kind: 'encrypted', signed: res.value.signed };\n    paintDone();\n  };\n\n  if (!signer) return run();\n  if (state.env && state.env.device === 'ready') return run();\n  waitForDevice(run);\n}\n\n/* ---------- decrypting ---------- */\n\nfunction startDecrypt() {\n  const run = async () => {\n    working('Decrypting file…', 'Follow the prompts on your Ledger.');\n    const res = await bridge.decrypt(state.file.path);\n    if (!res.ok) return failedOperation(res.error);\n    state.result = { outputPath: res.value.outputPath, name: res.value.name, kind: 'decrypted' };\n    paintDone();\n  };\n  if (state.env && state.env.device === 'ready') return run();\n  waitForDevice(run);\n}\n\nfunction working(title, sub) {\n  fillPill($('working-file'), state.file.name, humanSize(state.file.size));\n  $('working-title').textContent = title;\n  $('working-sub').textContent = sub || '';\n  show('screen-working');\n}\n\n// Errors during an operation keep the working screen and add the bar, the way\n// the design shows them.\nfunction failedOperation(message) {\n  const text = String(message || '');\n  if (/cancel/i.test(text)) return notice('The request was cancelled on your Ledger', 'Try again');\n  if (/wrong pin|bad pin/i.test(text)) return notice('Wrong PIN', 'Try again');\n  if (/no secret key|not available/i.test(text)) return notice('This Ledger can’t decrypt the file', 'Connect a Ledger that holds one of the required keys');\n  if (/damaged|unsupported|no valid openpgp/i.test(text)) return notice('The file may be damaged or unsupported', 'Choose another file');\n  if (/device|card/i.test(text)) return notice('Reconnect your Ledger to continue.');\n  notice(text || 'Something went wrong');\n}\n\nfunction paintDone() {\n  const encrypted = state.result.kind === 'encrypted';\n  fillPill($('done-file'), state.result.name, '');\n  $('done-title').textContent = encrypted ? 'File encrypted' : 'File decrypted';\n  const sub = $('done-sub');\n  if (encrypted) {\n    const n = state.selected.size;\n    sub.textContent = `Can be decrypted by ${n} ${n === 1 ? 'key' : 'keys'}`;\n  } else {\n    sub.textContent = '';\n  }\n  sub.hidden = !sub.textContent;\n  $('btn-trash').textContent = encrypted ? 'Move original to Trash' : 'Move encrypted file to Trash';\n  $('done-caption').textContent = encrypted\n    ? 'The original file is still on your Mac.'\n    : 'The encrypted file is still on your Mac.';\n  show('screen-done');\n}\n\n/* ---------- importing a public key ---------- */\n\nfunction openImport() { show('screen-import'); }\n\nasync function acceptKeyFile(filePath) {\n  const res = await bridge.inspectKey(filePath);\n  if (!res.ok) {\n    if (res.error === 'unreadable') return notice('Choose a valid OpenPGP public key');\n    return notice('This file doesn’t contain an OpenPGP public key');\n  }\n  const key = res.value;\n  if (key.already) return notice(`${key.name || key.email} is already in your public keys`);\n  state.pendingKey = { ...key, path: filePath };\n  $('review-name').textContent = key.name || '(no name)';\n  $('review-mail').textContent = key.email || '';\n  $('review-fpr').textContent = key.fingerprintPretty || key.fingerprint;\n  show('screen-review');\n}\n\nasync function addPendingKey() {\n  const res = await bridge.addKey(state.pendingKey.path);\n  if (!res.ok) return notice('Sealbox could not add this key', res.error);\n  await refreshStatus();\n  state.pendingKey = null;\n  if (state.file && state.file.encryption !== 'publicKey') return startEncrypt();\n  show('screen-drop');\n}\n\n/* The Details button on the status row. It shows the same card as the last step\n   of setup, filled from the key that is actually on the device — so it is\n   never an empty form. */\nfunction showKeyDetails() {\n  const recovery = state.env && state.env.recovery;\n  if (!recovery) return openSetup(1);\n  state.recovery = recovery;\n  $('rec-time').textContent = recovery.timestamp;\n  $('rec-name').textContent = recovery.name || '—';\n  $('rec-mail').textContent = recovery.email || '—';\n  $('rec-type').textContent = recovery.keyType || '—';\n  openSetup(8);\n}\n\n/* ---------- setup ---------- */\n\nconst SETUP_TOTAL = COPY.SETUP_TOTAL;\n\nfunction openSetup(step) {\n  state.setupStep = step;\n  switch (step) {\n    case 1:\n      show('s-intro');\n      break;\n    case 2:\n      setProgress('p-prepare', 1, SETUP_TOTAL);\n      show('s-prepare');\n      break;\n    case 3:\n      setProgress('p-openpgp', 2, SETUP_TOTAL);\n      show('s-openpgp');\n      break;\n    case 4:\n      setProgress('p-seed', 3, SETUP_TOTAL);\n      show('s-seed');\n      break;\n    case 5:\n      setProgress('p-connect', 4, SETUP_TOTAL);\n      show('s-connect');\n      pollConnect();\n      break;\n    case 6:\n      setProgress('p-key', 5, SETUP_TOTAL);\n      show('s-key');\n      break;\n    case 7:\n      setProgress('p-creating', 6, SETUP_TOTAL);\n      show('s-creating');\n      break;\n    case 8:\n      setProgress('p-recovery', 7, SETUP_TOTAL);\n      show('s-recovery');\n      break;\n    case 9:\n      show('s-done');\n      break;\n    default:\n      show('screen-drop');\n  }\n}\n\nasync function runPrepare() {\n  $('s-prepare-title').textContent = 'Preparing your Mac';\n  $('s-prepare-sub').textContent = 'This may take a moment.';\n  const button = $('s-prepare-next');\n  button.className = 'btn secondary inert';\n  button.textContent = 'Preparing…';\n  button.disabled = true;\n  $('s-prepare-log').hidden = false;\n\n  const res = await bridge.setupPrepare();\n  button.disabled = false;\n  if (!res.ok) {\n    $('s-failed-sub').textContent = 'Something went wrong during setup.';\n    $('s-failed-log').textContent = res.error || '';\n    return show('s-prepare-failed');\n  }\n  $('s-prepare-title').textContent = 'Mac is ready';\n  $('s-prepare-sub').textContent = '';\n  $('s-prepare-sub').hidden = true;\n  button.className = 'btn primary';\n  button.textContent = 'Continue';\n  button.onclick = () => openSetup(3);\n}\n\nfunction pollConnect() {\n  stopWaiting();\n  const paint = (device) => {\n    const ready = device === 'ready' || device === 'no-key';\n    $('s-connect-ring').hidden = ready;\n    $('s-connect-check').hidden = !ready;\n    $('s-connect-status').classList.toggle('done', ready);\n    $('s-connect-next').hidden = !ready;\n    $('s-connect-text').textContent =\n      ready ? 'Ledger ready'\n        : device === 'closed' ? 'Open OpenPGP on your Ledger'\n        : device === 'ledger-live' ? 'Quit Ledger Live'\n        : 'Waiting for Ledger…';\n    $('s-connect-sub').innerHTML = ready\n      ? 'Quit Ledger Live, then connect and unlock your Ledger.<br />Open OpenPGP on your Ledger.'\n      : 'Connect and unlock your Ledger, then open OpenPGP.<br />Make sure Ledger Live is closed.';\n  };\n  paint(state.env ? state.env.device : 'disconnected');\n  state.waitTimer = setInterval(async () => {\n    const env = await refreshStatus();\n    if (env && state.screen === 's-connect') paint(env.device);\n  }, 1500);\n}\n\nasync function createKey() {\n  const name = $('s-key-name').value.trim();\n  const email = $('s-key-mail').value.trim();\n  if (!name || !email) return notice('Enter a name and an email', 'They become part of the key and of its recovery details');\n  openSetup(7);\n  const res = await bridge.generateKey(name, email);\n  if (!res.ok) {\n    openSetup(6);\n    return notice('The key was not created', res.error);\n  }\n  state.recovery = res.value.recovery;\n  $('s-creating-status').hidden = false;\n  setTimeout(() => {\n    $('rec-time').textContent = state.recovery.timestamp;\n    $('rec-name').textContent = state.recovery.name;\n    $('rec-mail').textContent = state.recovery.email;\n    $('rec-type').textContent = state.recovery.keyType;\n    openSetup(8);\n  }, 900);\n}\n\nasync function saveRecovery() {\n  const res = await bridge.saveRecovery(state.recovery);\n  if (!res.ok) return notice('Could not save the file', res.error);\n  const button = $('s-recovery-next');\n  button.className = 'btn secondary inert';\n  button.textContent = '✓ Recovery details saved';\n  button.onclick = () => openSetup(9);\n  setTimeout(() => {\n    button.className = 'btn primary';\n    button.textContent = 'Continue';\n  }, 1200);\n}\n\n/* ---------- events ---------- */\n\nfunction wire() {\n  on('win-close', 'click', () => bridge.windowClose());\n  on('win-min', 'click', () => bridge.windowMinimise());\n  on('notice-x', 'click', hideNotice);\n\n  // Drag and drop, on the whole window: dropping is the app's one gesture.\n  document.addEventListener('dragover', (e) => {\n    e.preventDefault();\n    if (state.screen === 'screen-drop') $('dropzone').classList.add('is-over');\n  });\n  document.addEventListener('dragleave', () => $('dropzone').classList.remove('is-over'));\n  document.addEventListener('drop', (e) => {\n    e.preventDefault();\n    $('dropzone').classList.remove('is-over');\n    const file = e.dataTransfer.files[0];\n    if (!file) return;\n    const path = bridge.pathForFile(file);\n    if (!path) return;\n    if (state.screen === 'screen-import') return acceptKeyFile(path);\n    if (state.screen === 'screen-drop') return accept(path);\n  });\n\n  on('btn-choose', 'click', async () => {\n    const res = await bridge.pickFile('any');\n    if (res.ok && res.value) accept(res.value);\n  });\n  on('btn-choose-key', 'click', async () => {\n    const res = await bridge.pickFile('key');\n    if (res.ok && res.value) acceptKeyFile(res.value);\n  });\n\n  ['btn-import-key', 'btn-import-key-2', 'btn-import-key-3'].forEach((id) => on(id, 'click', openImport));\n  on('import-back', 'click', () => show(state.file ? 'screen-keys' : 'screen-drop'));\n  on('review-back', 'click', openImport);\n  on('review-close', 'click', () => show('screen-drop'));\n  on('btn-add-key', 'click', addPendingKey);\n  on('nokeys-close', 'click', () => show('screen-drop'));\n  on('btn-setup-ledger', 'click', () => openSetup(1));\n\n  on('btn-encrypt', 'click', runEncrypt);\n  on('device-close', 'click', () => { stopWaiting(); show('screen-drop'); });\n  on('device-setup', 'click', () => { stopWaiting(); openSetup(1); });\n  on('done-close', 'click', reset);\n  on('btn-reveal', 'click', () => bridge.reveal(state.result.outputPath));\n  on('btn-trash', 'click', async () => {\n    const target = state.result.kind === 'encrypted' ? state.file.path : state.file.path;\n    const res = await bridge.trash(target);\n    if (!res.ok) return notice('Could not move the file to Trash', res.error);\n    $('btn-trash').disabled = true;\n    $('done-caption').textContent = 'Moved to Trash.';\n  });\n\n  on('ledger-action', 'click', async () => {\n    const current = state.env ? state.env.device : null;\n    if (current === 'ready') return showKeyDetails();\n    if (current === 'no-gpg' || current === 'no-key') return openSetup(1);\n    // \"Connect\", \"Check again\", \"Try again\" all mean the same thing: look again.\n    paintLedgerBar('checking');\n    await refreshStatus();\n  });\n  on('ledgerbar', 'click', (e) => { if (e.target.id !== 'ledger-action') refreshStatus(); });\n\n  on('s-intro-next', 'click', () => openSetup(2));\n  on('s-intro-close', 'click', () => show('screen-drop'));\n  on('s-prepare-next', 'click', runPrepare);\n  on('s-prepare-close', 'click', () => show('screen-drop'));\n  on('s-failed-retry', 'click', () => openSetup(2));\n  on('s-failed-details', 'click', () => { $('s-failed-log').hidden = !$('s-failed-log').hidden; });\n  on('s-openpgp-back', 'click', () => openSetup(2));\n  on('s-openpgp-close', 'click', () => show('screen-drop'));\n  on('s-openpgp-next', 'click', () => openSetup(4));\n  on('s-seed-back', 'click', () => openSetup(3));\n  on('s-seed-close', 'click', () => show('screen-drop'));\n  on('s-seed-consent', 'click', () => {\n    state.seedAcknowledged = !state.seedAcknowledged;\n    $('s-seed-box').setAttribute('href', state.seedAcknowledged ? '#i-box-on' : '#i-box-off');\n    $('s-seed-next').disabled = !state.seedAcknowledged;\n  });\n  on('s-seed-next', 'click', () => openSetup(5));\n  on('s-connect-back', 'click', () => { stopWaiting(); openSetup(4); });\n  on('s-connect-close', 'click', () => { stopWaiting(); show('screen-drop'); });\n  on('s-connect-next', 'click', () => { stopWaiting(); openSetup(6); });\n  on('s-key-back', 'click', () => openSetup(5));\n  on('s-key-close', 'click', () => show('screen-drop'));\n  on('s-key-next', 'click', createKey);\n  on('s-recovery-close', 'click', () => openSetup(9));\n  on('s-recovery-copy', 'click', () => bridge.copyText(recoveryText()));\n  on('s-recovery-next', 'click', saveRecovery);\n  on('s-done-next', 'click', () => { refreshStatus(); show('screen-drop'); });\n}\n\nfunction recoveryText() {\n  const r = state.recovery || {};\n  return `Timestamp: ${r.timestamp}\\nName: ${r.name}\\nEmail: ${r.email}\\nKey type: ${r.keyType}`;\n}\n\nfunction reset() {\n  state.file = null;\n  state.result = null;\n  state.selected = new Set();\n  stopWaiting();\n  show('screen-drop');\n  refreshStatus();\n}\n\n/* ---------- start ---------- */\n\n(async function start() {\n  wire();\n  // Show the drop screen immediately. Probing the environment can take a couple\n  // of seconds on a machine with no GnuPG, and the window used to stay blank\n  // for the whole of it.\n  paintLedgerBar('checking');\n  show('screen-drop');\n  await refreshStatus();\n  if (state.env && state.env.device === 'no-gpg' && !state.keys.length) {\n    // Nothing is set up at all: offer the guide instead of an empty window.\n    openSetup(1);\n  }\n})();\n\n/* ---------- demo bridge ---------- */\n\n// preview.html runs this file in a browser, where window.api does not exist.\n// The demo bridge lets a reviewer or designer walk every screen without a Mac,\n// GnuPG or a device.\nfunction demoApi() {\n  const wait = (ms) => new Promise((r) => setTimeout(r, ms));\n  const ok = (value) => ({ ok: true, value });\n  return {\n    pathForFile: (f) => `/demo/${f.name}`,\n    status: async () => ok({\n      gpg: '/usr/local/bin/gpg',\n      device: 'ready',\n      appVersion: '1.1.0',\n      keys: [\n        { id: 'E4C302BC8672419D', fingerprint: 'E4C302BC8672419D', name: 'Boris Zozulya', email: 'boris@example.com', mine: true, onCard: true },\n        { id: 'AA11BB22CC33DD44', fingerprint: 'AA11BB22CC33DD44', name: 'Alex Morgan', email: 'alex@example.com', isNew: true },\n        { id: 'FF99EE88DD77CC66', fingerprint: 'FF99EE88DD77CC66', name: 'John Smith', email: 'john@example.com' },\n      ],\n      recovery: { timestamp: '19990101T000000!', name: 'Boris', email: 'boris@example.com', keyType: 'ed25519 / rsa2048' },\n    }),\n
