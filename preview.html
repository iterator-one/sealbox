<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sealbox — UI preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 36px 20px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background:
      radial-gradient(900px 600px at 18% 8%, #3a3070 0%, transparent 55%),
      radial-gradient(800px 700px at 88% 92%, #10456b 0%, transparent 55%),
      linear-gradient(160deg, #171a21 0%, #0d0f13 100%);
    color: #97a0b3;
  }
  .stack { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 11px; }
  .window {
    position: relative;
    width: 440px; height: 700px;
    border-radius: 24px; overflow: hidden;
    box-shadow: 0 34px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
    background: #101217;
  }
  
  .window.light { background: #f6f7f9; }
  .window iframe { width: 100%; height: 100%; border: 0; display: block; }
  .lights { position: absolute; top: 14px; left: 13px; display: flex; gap: 8px; z-index: 5; pointer-events: none; }
  .lights i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .lights i:nth-child(1) { background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }
  .caption { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: #a0a0a0; }
  .hint {
    max-width: 620px; text-align: center; font-size: 12.5px; line-height: 1.65; color: #97a0b3;
  }
  .hint b { color: #dfe4ee; font-weight: 600; }
  kbd {
    font: inherit; font-size: 11.5px; background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.14); border-radius: 5px; padding: 1px 6px;
  }
</style>
</head>
<body>

<div class="stack">
  <div class="unit">
    <div class="window" id="w-a"><span class="lights"><i></i><i></i><i></i></span></div>
    <span class="caption">Dark</span>
  </div>
  <div class="unit">
    <div class="window light" id="w-b"><span class="lights"><i></i><i></i><i></i></span></div>
    <span class="caption">Light</span>
  </div>
</div>

<p class="hint">
  A working interface, not a picture. The app opens on the drop screen; press
  <b>“Choose a file”</b> and it will notice what is missing and open the setup guide at that
  exact step. The two windows are independent.
</p>

<script>
const APP = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Sealbox</title>\n  <style>\n/* ==================================================================\n   Sealbox — presentation layer\n\n   Principles:\n   * large type (15px base, 22px headings) — the app is meant to be usable\n     by people who are not comfortable with computers, including the elderly;\n   * 48px buttons — easy to hit;\n   * one action per screen, and exactly one bright primary button;\n   * no icons: there is nothing for the eye to decode except text and a button.\n\n   Dark theme by default, light theme from the system setting or forced\n   through the data-theme attribute.\n   ================================================================== */\n\n:root {\n  --accent-1: #5b8cff;\n  --accent-2: #8b5cf6;\n  --good: #32d583;\n  --warn: #f5a623;\n  --bad: #f97066;\n\n  --surface: rgba(28, 31, 38, 0.72);\n  --surface-2: rgba(40, 44, 54, 0.85);\n  --line: rgba(255, 255, 255, 0.1);\n  --line-strong: rgba(255, 255, 255, 0.18);\n  --text: #f1f3f7;\n  --muted: #9aa2b1;\n  --faint: rgba(255, 255, 255, 0.05);\n  --page: rgba(16, 18, 23, 0.72);\n  --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);\n\n  --r-md: 13px;\n  --r-lg: 20px;\n  --ease: cubic-bezier(0.32, 0.72, 0, 1);\n}\n\n@media (prefers-color-scheme: light) {\n  :root:not([data-theme=\"dark\"]) {\n    --surface: rgba(255, 255, 255, 0.8);\n    --surface-2: rgba(255, 255, 255, 0.96);\n    --line: rgba(0, 0, 0, 0.1);\n    --line-strong: rgba(0, 0, 0, 0.18);\n    --text: #16191f;\n    --muted: #5f6875;\n    --faint: rgba(0, 0, 0, 0.04);\n    --page: rgba(246, 247, 249, 0.72);\n    --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);\n  }\n}\n:root[data-theme=\"light\"] {\n  --surface: rgba(255, 255, 255, 0.8);\n  --surface-2: rgba(255, 255, 255, 0.96);\n  --line: rgba(0, 0, 0, 0.1);\n  --line-strong: rgba(0, 0, 0, 0.18);\n  --text: #16191f;\n  --muted: #5f6875;\n  --faint: rgba(0, 0, 0, 0.04);\n  --page: rgba(246, 247, 249, 0.72);\n  --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n[hidden] { display: none !important; }\n\nhtml, body { height: 100%; }\n\nbody {\n  background: var(--page);\n  color: var(--text);\n  font: 15px/1.5 -apple-system, BlinkMacSystemFont, \"SF Pro Text\", system-ui, sans-serif;\n  -webkit-font-smoothing: antialiased;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  user-select: none;\n  cursor: default;\n}\n\n/* ───────────── header ───────────── */\n.header {\n  position: relative;\n  flex: 0 0 44px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 0 16px 0 78px;\n  -webkit-app-region: drag;\n}\n.header-side { display: flex; align-items: center; gap: 8px; }\n.header-side.right { margin-left: auto; }\n\n.header-title {\n  position: absolute;\n  left: 78px;\n  right: 78px;\n  text-align: center;\n  pointer-events: none;\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--muted);\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.circle-btn {\n  -webkit-app-region: no-drag;\n  width: 28px;\n  height: 28px;\n  border: 1.5px solid var(--line-strong);\n  border-radius: 50%;\n  background: none;\n  color: var(--muted);\n  display: grid;\n  place-items: center;\n  cursor: pointer;\n  font: inherit;\n  font-size: 15px;\n  font-weight: 600;\n  line-height: 1;\n  padding: 0;\n  transition: color .18s, border-color .18s, background .18s;\n}\n.circle-btn:hover { color: var(--text); border-color: var(--accent-1); background: var(--faint); }\n.circle-btn img { display: block; width: 7px; height: 12px; opacity: .75; }\n\n.version-badge {\n  font-size: 10.5px;\n  font-weight: 600;\n  letter-spacing: 0.04em;\n  padding: 3px 7px;\n  border-radius: 5px;\n  color: var(--muted);\n  background: var(--faint);\n  border: 1px solid var(--line);\n}\n\n/* ───────────── screens ───────────── */\n.stage { flex: 1 1 auto; position: relative; overflow: hidden; }\n\n.screen {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  flex-direction: column;\n  opacity: 0;\n  transform: translateY(8px) scale(0.985);\n  pointer-events: none;\n  transition: opacity .28s var(--ease), transform .28s var(--ease);\n}\n.screen.is-active { opacity: 1; transform: none; pointer-events: auto; }\n\n.content {\n  flex: 1 1 auto;\n  min-height: 0;\n  overflow-y: auto;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n  padding: 6px 24px 8px;\n}\n.content.centered { justify-content: center; align-items: center; text-align: center; gap: 18px; }\n\n.bottom {\n  flex: 0 0 auto;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  padding: 8px 24px 22px;\n}\n\n/* ───────────── buttons ───────────── */\n.btn {\n  min-height: 48px;\n  width: 100%;\n  padding: 12px 18px;\n  border: 1.5px solid var(--line-strong);\n  border-radius: 12px;\n  background: var(--surface);\n  color: var(--text);\n  font: inherit;\n  font-size: 15px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: transform .12s var(--ease), filter .18s, background .18s, border-color .18s;\n}\n.btn:hover { background: var(--surface-2); border-color: var(--accent-1); }\n.btn:active { transform: scale(.985); }\n\n.btn.primary {\n  border-color: transparent;\n  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));\n  color: #fff;\n  font-weight: 600;\n  box-shadow: 0 4px 14px rgba(91, 140, 255, .3);\n}\n.btn.primary:hover {\n  filter: brightness(1.08);\n  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));\n  border-color: transparent;\n}\n.btn.primary:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; filter: none; }\n\n.btn.quiet {\n  background: none;\n  border-color: transparent;\n  color: var(--muted);\n  min-height: 42px;\n}\n.btn.quiet:hover { background: var(--faint); color: var(--text); border-color: transparent; }\n\n.linklike {\n  background: none;\n  border: 0;\n  padding: 4px;\n  font: inherit;\n  font-size: 13.5px;\n  color: var(--accent-1);\n  cursor: pointer;\n}\n.linklike:hover { text-decoration: underline; }\n\n/* ───────────── padlock ───────────── */\n.lock { color: var(--muted); transition: color .3s; }\n.lock-svg { width: 62px; height: 72px; stroke: currentColor; fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }\n.lock-svg .body { fill: currentColor; opacity: .1; }\n.lock-svg .shackle { transform-origin: 32px 30px; transition: transform .4s var(--ease); }\n\n.pulse { display: grid; place-items: center; }\n.pulse .lock-svg { width: 70px; height: 80px; color: var(--accent-1); }\n.lock-svg.working .shackle { animation: shackle 1.5s var(--ease) infinite; }\n.lock-svg.working .pin { animation: pin 1.5s var(--ease) infinite; transform-origin: 32px 47px; }\n@keyframes shackle { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-5px); } }\n@keyframes pin { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } }\n\n/* ───────────── drop zone ───────────── */\n.dropzone {\n  position: relative;\n  flex: 1 1 auto;\n  min-height: 200px;\n  border-radius: var(--r-lg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  padding: 20px;\n  text-align: center;\n  background: var(--faint);\n  transition: background .25s var(--ease), transform .25s var(--ease);\n}\n.dropzone::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  border-radius: inherit;\n  border: 2px dashed var(--line-strong);\n  transition: border-color .25s var(--ease);\n  pointer-events: none;\n}\n.dropzone.is-over { transform: scale(1.012); background: rgba(91, 140, 255, .1); }\n.dropzone.is-over::before { border-color: var(--accent-1); border-style: solid; }\n.dropzone.is-over .lock { color: var(--accent-1); }\n.dropzone.is-over .lock-svg .shackle { transform: translateY(-3px); }\n\n/* ───────────── text ───────────── */\n.title { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; }\n.title.big { font-size: 24px; }\n.subtitle { font-size: 14.5px; line-height: 1.5; color: var(--muted); }\n.subtitle b { color: var(--text); font-weight: 600; }\n.hero-text { display: flex; flex-direction: column; gap: 8px; }\n.hero-text.center { text-align: center; align-items: center; max-width: 320px; }\n\n.caption { font-size: 12.5px; line-height: 1.45; color: var(--muted); }\n.caption.warn { color: var(--warn); }\n\n.section-label {\n  font-size: 11.5px;\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n/* ───────────── steps ───────────── */\n.steps { display: flex; flex-direction: column; gap: 12px; }\n.step-row { display: flex; gap: 12px; align-items: flex-start; }\n.step-num {\n  flex: 0 0 24px;\n  height: 24px;\n  margin-top: 1px;\n  border-radius: 50%;\n  background: var(--faint);\n  border: 1px solid var(--line-strong);\n  color: var(--accent-1);\n  font-size: 12.5px;\n  font-weight: 700;\n  display: grid;\n  place-items: center;\n}\n.step-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }\n.step-title { font-size: 15px; line-height: 1.4; }\n.step-sub { font-size: 13px; line-height: 1.4; color: var(--muted); }\n\n/* ───────────── cards and rows ───────────── */\n.card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-md);\n  box-shadow: var(--shadow);\n  overflow: hidden;\n}\n.kv-row {\n  display: flex;\n  align-items: baseline;\n  gap: 12px;\n  padding: 11px 14px;\n}\n.kv-row + .kv-row { border-top: 1px solid var(--line); }\n.kv-key { flex: 0 0 auto; font-size: 13.5px; color: var(--muted); }\n.kv-val {\n  flex: 1 1 auto;\n  min-width: 0;\n  font-size: 14px;\n  font-weight: 500;\n  text-align: right;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  user-select: text;\n}\n.kv-val.mono { font-family: ui-monospace, \"SF Mono\", Menlo, monospace; font-size: 12.5px; }\n\n.status-row {\n  display: flex;\n  align-items: center;\n  gap: 11px;\n  padding: 13px 14px;\n  border-radius: 12px;\n  background: var(--faint);\n  border: 1px solid var(--line);\n  font-size: 14px;\n  line-height: 1.4;\n}\n.status-row.ok { border-color: rgba(50, 213, 131, .35); background: rgba(50, 213, 131, .08); }\n.status-row.waiting { border-color: rgba(245, 166, 35, .35); background: rgba(245, 166, 35, .08); }\n.status-row.clickable { cursor: pointer; }\n.status-row.clickable:hover { border-color: var(--accent-1); }\n.status-dot { flex: 0 0 10px; height: 10px; border-radius: 50%; background: var(--line-strong); }\n.status-row.ok .status-dot { background: var(--good); box-shadow: 0 0 0 4px rgba(50, 213, 131, .16); }\n.status-row.waiting .status-dot { background: var(--warn); animation: blink 1.4s ease-in-out infinite; }\n@keyframes blink { 50% { opacity: .3; } }\n.status-text b { font-weight: 600; }\n\n/* ───────────── progress ───────────── */\n.progress { display: flex; gap: 6px; justify-content: center; }\n.progress i {\n  width: 26px;\n  height: 4px;\n  border-radius: 2px;\n  background: var(--line-strong);\n  transition: background .3s var(--ease);\n}\n.progress i.done { background: var(--accent-1); opacity: .45; }\n.progress i.now { background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); opacity: 1; }\n\n.loader {\n  width: 100px;\n  height: 4px;\n  border-radius: 2px;\n  background: var(--line-strong);\n  overflow: hidden;\n  position: relative;\n}\n.loader::after {\n  content: \"\";\n  position: absolute;\n  top: 0; bottom: 0; left: -40%;\n  width: 40%;\n  border-radius: inherit;\n  background: linear-gradient(90deg, var(--accent-1), var(--accent-2));\n  animation: slide 1.4s var(--ease) infinite;\n}\n@keyframes slide { to { left: 100%; } }\n\n/* ───────────── result ───────────── */\n.check { color: var(--good); }\n.check svg { width: 62px; height: 62px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }\n.check circle { stroke-dasharray: 152; stroke-dashoffset: 152; animation: draw .5s var(--ease) forwards; }\n.check path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .35s var(--ease) .35s forwards; }\n@keyframes draw { to { stroke-dashoffset: 0; } }\n.check.bad { color: var(--bad); }\n\n.filename { font-size: 13.5px; color: var(--muted); word-break: break-all; user-select: text; max-width: 300px; }\n\n/* ───────────── inputs ───────────── */\n.field { display: flex; flex-direction: column; gap: 7px; }\n.field > label { font-size: 13.5px; font-weight: 500; }\n\ninput[type=\"text\"] {\n  width: 100%;\n  padding: 13px 14px;\n  background: var(--surface);\n  border: 1.5px solid var(--line);\n  border-radius: 12px;\n  color: var(--text);\n  font: inherit;\n  font-size: 15px;\n  outline: none;\n  user-select: text;\n  transition: border-color .2s, box-shadow .2s;\n}\ninput::placeholder { color: var(--muted); opacity: .55; }\ninput:focus { border-color: var(--accent-1); box-shadow: 0 0 0 4px rgba(91, 140, 255, .16); }\n\n/* ───────────── log ───────────── */\n.log {\n  width: 100%;\n  max-height: 120px;\n  overflow-y: auto;\n  padding: 10px 12px;\n  border-radius: 10px;\n  background: var(--faint);\n  border: 1px solid var(--line);\n  font: 11px/1.55 ui-monospace, \"SF Mono\", Menlo, monospace;\n  color: var(--muted);\n  text-align: left;\n  white-space: pre-wrap;\n  word-break: break-all;\n}\n\n/* ───────────── misc ───────────── */\n::-webkit-scrollbar { width: 8px; }\n::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }\n::-webkit-scrollbar-track { background: transparent; }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }\n}\n\n</style>\n</head>\n<body>\n\n<header class=\"header\">\n  <div class=\"header-side left\">\n    <button class=\"circle-btn\" id=\"btn-header-back\" hidden aria-label=\"Back\">‹</button>\n  </div>\n  <div class=\"header-title\" id=\"header-title\">Sealbox</div>\n  <div class=\"header-side right\">\n    <span class=\"version-badge\" id=\"version-badge\">v1.0.2</span>\n    <button class=\"circle-btn\" id=\"btn-help\" aria-label=\"Setup guide\">?</button>\n  </div>\n</header>\n\n<main class=\"stage\">\n\n  <!-- ════════════ Setup guide ════════════ -->\n  <section class=\"screen\" id=\"screen-guide\">\n    <div class=\"content\">\n      <div class=\"progress\" id=\"guide-dots\"></div>\n\n      <div class=\"hero-text\">\n        <div class=\"title\" id=\"guide-title\"></div>\n        <div class=\"subtitle\" id=\"guide-lead\"></div>\n      </div>\n\n      <div class=\"steps\" id=\"guide-steps\"></div>\n\n      <button class=\"btn primary\" id=\"btn-guide-action\" hidden></button>\n      <pre class=\"log\" id=\"guide-log\" hidden></pre>\n\n      <div class=\"status-row\" id=\"guide-check\" hidden>\n        <span class=\"status-dot\"></span>\n        <span class=\"status-text\" id=\"guide-check-text\"></span>\n      </div>\n\n      <button class=\"linklike\" id=\"btn-guide-fix\" hidden></button>\n      <p class=\"caption\" id=\"guide-note\" hidden></p>\n    </div>\n\n    <div class=\"bottom\">\n      <button class=\"btn primary\" id=\"btn-guide-next\">Next</button>\n      <button class=\"btn quiet\" id=\"btn-guide-back\">Back</button>\n    </div>\n  </section>\n\n  <!-- ════════════ Main screen ════════════ -->\n  <section class=\"screen\" id=\"screen-drop\">\n    <div class=\"content\">\n      <div class=\"dropzone\" id=\"dropzone\">\n        <div class=\"lock\">\n          <svg viewBox=\"0 0 64 74\" class=\"lock-svg\" aria-hidden=\"true\">\n            <path class=\"shackle\" d=\"M18 30V21a14 14 0 0 1 28 0v9\" />\n            <rect class=\"body\" x=\"6\" y=\"30\" width=\"52\" height=\"40\" rx=\"11\" />\n            <circle class=\"pin\" cx=\"32\" cy=\"47\" r=\"4.2\" />\n            <path class=\"stem\" d=\"M32 51.5v6\" />\n          </svg>\n        </div>\n        <div class=\"hero-text center\">\n          <div class=\"title\">Drop a file here</div>\n          <div class=\"subtitle\">It becomes readable only to you</div>\n        </div>\n      </div>\n\n      <div class=\"status-row clickable\" id=\"statusline\">\n        <span class=\"status-dot\"></span>\n        <span class=\"status-text\"></span>\n      </div>\n    </div>\n\n    <div class=\"bottom\">\n      <button class=\"btn primary\" id=\"btn-pick\">Choose a file</button>\n    </div>\n  </section>\n\n  <!-- ════════════ Create a key ════════════ -->\n  <section class=\"screen\" id=\"screen-newkey\">\n    <div class=\"content\">\n      <div class=\"hero-text\">\n        <div class=\"title\">Let's create your key</div>\n        <div class=\"subtitle\">It appears inside the Ledger and never leaves it. This is done once.</div>\n      </div>\n\n      <p class=\"caption\" id=\"nk-context\"></p>\n\n      <div class=\"field\">\n        <label for=\"nk-name\">Your name</label>\n        <input type=\"text\" id=\"nk-name\" spellcheck=\"false\" placeholder=\"Boris Zozulya\" />\n      </div>\n\n      <div class=\"field\">\n        <label for=\"nk-email\">Email</label>\n        <input type=\"text\" id=\"nk-email\" spellcheck=\"false\" placeholder=\"you@example.com\" />\n      </div>\n\n      <p class=\"caption\">At least 5 characters in the name — that is what GnuPG requires.</p>\n\n      <div class=\"status-row\" id=\"nk-check\">\n        <span class=\"status-dot\"></span>\n        <span class=\"status-text\" id=\"nk-check-text\"></span>\n      </div>\n    </div>\n\n    <div class=\"bottom\">\n      <button class=\"btn primary\" id=\"btn-genkey\" disabled>Create the key</button>\n      <button class=\"btn quiet\" data-action=\"reset\">Cancel</button>\n    </div>\n  </section>\n\n  <!-- ════════════ Creating the key ════════════ -->\n  <section class=\"screen\" id=\"screen-keybusy\">\n    <div class=\"content centered\">\n      <div class=\"pulse\">\n        <svg viewBox=\"0 0 64 74\" class=\"lock-svg working\" aria-hidden=\"true\">\n          <path class=\"shackle\" d=\"M18 30V21a14 14 0 0 1 28 0v9\" />\n          <rect class=\"body\" x=\"6\" y=\"30\" width=\"52\" height=\"40\" rx=\"11\" />\n          <circle class=\"pin\" cx=\"32\" cy=\"47\" r=\"4.2\" />\n          <path class=\"stem\" d=\"M32 51.5v6\" />\n        </svg>\n      </div>\n      <div class=\"hero-text center\">\n        <div class=\"title\">Creating the key</div>\n        <div class=\"subtitle\">Watch the Ledger screen — it will ask for a PIN. Factory default: <b>123456</b>, admin <b>12345678</b>.</div>\n      </div>\n      <div class=\"loader\"></div>\n      <button class=\"linklike\" id=\"btn-toggle-log\">Show details</button>\n      <pre class=\"log\" id=\"key-log\" hidden></pre>\n    </div>\n  </section>\n\n  <!-- ════════════ Key created ════════════ -->\n  <section class=\"screen\" id=\"screen-keydone\">\n    <div class=\"content\">\n      <div class=\"hero-text\">\n        <div class=\"title\">Your key is ready</div>\n        <div class=\"subtitle\">Save these details. When the Ledger updates, the key is wiped — this is the only way back.</div>\n      </div>\n\n      <div class=\"section-label\">Recovery card</div>\n      <div class=\"card\" id=\"recovery-box\"></div>\n\n      <p class=\"caption warn\">Without them your files can never be opened again. Print it or copy it out by hand.</p>\n    </div>\n\n    <div class=\"bottom\">\n      <button class=\"btn primary\" id=\"btn-save-recovery\">Save the recovery card</button>\n      <button class=\"btn\" id=\"btn-continue\">Continue</button>\n    </div>\n  </section>\n\n  <!-- ════════════ Encrypt ════════════ -->\n  <section class=\"screen\" id=\"screen-encrypt\">\n    <div class=\"content\">\n      <div class=\"section-label\">File</div>\n      <div class=\"card\">\n        <div class=\"kv-row\"><span class=\"kv-key\">Name</span><span class=\"kv-val\" id=\"enc-name\"></span></div>\n        <div class=\"kv-row\"><span class=\"kv-key\">Size</span><span class=\"kv-val\" id=\"enc-size\"></span></div>\n        <div class=\"kv-row\"><span class=\"kv-key\">Key</span><span class=\"kv-val\" id=\"mk-title\"></span></div>\n      </div>\n\n      <p class=\"caption\">Only you will be able to open it — with this Ledger in hand.</p>\n\n      <div class=\"status-row\" id=\"enc-check\">\n        <span class=\"status-dot\"></span>\n        <span class=\"status-text\" id=\"enc-check-text\"></span>\n      </div>\n    </div>\n\n    <div class=\"bottom\">\n      <button class=\"btn primary\" id=\"btn-encrypt\">Lock the file</button>\n      <button class=\"btn quiet\" data-action=\"reset\">Cancel</button>\n    </div>\n  </section>\n\n  <!-- ════════════ Decrypt ════════════ -->\n  <section class=\"screen\" id=\"screen-decrypt\">\n    <div class=\"content\">\n      <div class=\"section-label\">Locked file</div>\n      <div class=\"card\">\n        <div class=\"kv-row\"><span class=\"kv-key\">Name</span><span class=\"kv-val\" id=\"dec-name\"></span></div>\n        <div class=\"kv-row\"><span class=\"kv-key\">Size</span><span class=\"kv-val\" id=\"dec-size\"></span></div>\n      </div>\n\n      <p class=\"caption\">The device will ask for a PIN. If you never changed it — 123456.</p>\n\n      <div class=\"status-row\" id=\"dec-check\">\n        <span class=\"status-dot\"></span>\n        <span class=\"status-text\" id=\"dec-check-text\"></span>\n      </div>\n    </div>\n\n    <div class=\"bottom\">\n      <button class=\"btn primary\" id=\"btn-decrypt\">Open the file</button>\n      <button class=\"btn quiet\" data-action=\"reset\">Cancel</button>\n    </div>\n  </section>\n\n  <!-- ════════════ Working ════════════ -->\n  <section class=\"screen\" id=\"screen-busy\">\n    <div class=\"content centered\">\n      <div class=\"pulse\">\n        <svg viewBox=\"0 0 64 74\" class=\"lock-svg working\" aria-hidden=\"true\">\n          <path class=\"shackle\" d=\"M18 30V21a14 14 0 0 1 28 0v9\" />\n          <rect class=\"body\" x=\"6\" y=\"30\" width=\"52\" height=\"40\" rx=\"11\" />\n          <circle class=\"pin\" cx=\"32\" cy=\"47\" r=\"4.2\" />\n          <path class=\"stem\" d=\"M32 51.5v6\" />\n        </svg>\n      </div>\n      <div class=\"hero-text center\">\n        <div class=\"title\" id=\"busy-text\"></div>\n        <div class=\"subtitle\" id=\"busy-tip\"></div>\n      </div>\n      <div class=\"loader\"></div>\n    </div>\n  </section>\n\n  <!-- ════════════ Done ════════════ -->\n  <section class=\"screen\" id=\"screen-done\">\n    <div class=\"content centered\">\n      <div class=\"check\">\n        <svg viewBox=\"0 0 52 52\" aria-hidden=\"true\"><circle cx=\"26\" cy=\"26\" r=\"24\"/><path d=\"M15 27l8 8 15-16\"/></svg>\n      </div>\n      <div class=\"hero-text center\">\n        <div class=\"title\" id=\"done-title\"></div>\n        <div class=\"filename\" id=\"done-file\"></div>\n        <div class=\"subtitle\" id=\"done-explain\"></div>\n      </div>\n    </div>\n\n    <div class=\"bottom\">\n      <button class=\"btn primary\" id=\"btn-reveal\">Show in Finder</button>\n      <button class=\"btn\" id=\"btn-trash\">Move the unlocked file to Trash</button>\n      <button class=\"btn quiet\" data-action=\"reset\">Done</button>\n    </div>\n  </section>\n\n  <!-- ════════════ Error ════════════ -->\n  <section class=\"screen\" id=\"screen-error\">\n    <div class=\"content centered\">\n      <div class=\"check bad\">\n        <svg viewBox=\"0 0 52 52\" aria-hidden=\"true\"><circle cx=\"26\" cy=\"26\" r=\"24\"/><path d=\"M26 15v16\"/><path d=\"M26 36.5v.01\"/></svg>\n      </div>\n      <div class=\"hero-text center\">\n        <div class=\"title\" id=\"err-title\">That did not work</div>\n        <div class=\"subtitle\" id=\"err-text\"></div>\n      </div>\n      <p class=\"caption\" id=\"err-tip\" hidden></p>\n    </div>\n\n    <div class=\"bottom\">\n      <button class=\"btn primary\" data-action=\"reset\">OK</button>\n      <button class=\"btn quiet\" id=\"btn-err-help\">Open the setup guide</button>\n    </div>\n  </section>\n\n</main>\n\n<script>\n'use strict';\n\n/* ==================================================================\n   Sealbox UI.\n\n   One protection mechanism: the key inside the Ledger. No passwords and\n   no choices — the user drops a file and presses one button.\n\n   On first launch a step-by-step setup is shown. Every step the app can\n   verify itself, it does verify — the user is never waved through blindly.\n\n   There is no cryptography and no disk access in this file: only calls to\n   window.api. When api is absent (opened in a browser) a demo mode kicks in,\n   which is how preview.html works.\n   ================================================================== */\n\nconst $ = (id) => document.getElementById(id);\n// NOT `const api`: preload.js exposes a global `window.api`, and a top-level\n// const of the same name collides with that non-configurable global property.\n// Electron then fails to parse this whole file and nothing runs at all, while\n// a browser preview (where window.api is absent) works fine — which is exactly\n// how the bug survived until the app was launched for real.\nconst bridge = window.api || demoApi();\n\nconst state = { file: null, env: null, recovery: null, result: null, source: null, step: 0 };\nlet poll = null;\n\n/* ───────────────────────── navigation ───────────────────────── */\n\n/** Window title per screen. */\nconst HEADERS = {\n  'screen-guide':   { title: 'Setup' },\n  'screen-drop':    { title: 'Sealbox' },\n  'screen-newkey':  { title: 'New key', back: true },\n  'screen-keybusy': { title: 'Creating key' },\n  'screen-keydone': { title: 'Key ready' },\n  'screen-encrypt': { title: 'Lock file', back: true },\n  'screen-decrypt': { title: 'Open file', back: true },\n  'screen-busy':    { title: 'Working' },\n  'screen-done':    { title: 'Done' },\n  'screen-error':   { title: 'Error' },\n};\n\nfunction show(id) {\n  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('is-active', s.id === id));\n  const header = HEADERS[id] || { title: 'Sealbox' };\n  $('header-title').textContent = header.title;\n  $('btn-header-back').hidden = !header.back;\n  if (poll) { clearInterval(poll); poll = null; }\n}\n\nfunction reset() {\n  state.file = null;\n  state.result = null;\n  state.source = null;\n  show('screen-drop');\n  refreshEnv().then(renderStatusline);\n  poll = setInterval(() => refreshEnv().then(renderStatusline), 3000);\n}\n\ndocument.querySelectorAll('[data-action=\"reset\"]').forEach((b) => b.addEventListener('click', reset));\n$('btn-header-back').addEventListener('click', reset);\n\nfunction fail(title, text, tip) {\n  $('err-title').textContent = title;\n  $('err-text').textContent = text;\n  $('err-tip').hidden = !tip;\n  if (tip) $('err-tip').textContent = tip.replace(/<\\/?b>/g, '');\n  show('screen-error');\n}\n\nconst humanSize = (b) =>\n  b < 1024 ? `${b} bytes`\n  : b < 1024 ** 2 ? `${(b / 1024).toFixed(0)} KB`\n  : b < 1024 ** 3 ? `${(b / 1024 ** 2).toFixed(1)} MB`\n  : `${(b / 1024 ** 3).toFixed(2)} GB`;\n\nconst shortFpr = (f) => (!f ? '' : f.slice(-16).replace(/(.{4})/g, '$1 ').trim());\n\n/* ───────────────────────── system state ───────────────────────── */\n\nasync function refreshEnv() {\n  const res = await bridge.status();\n  state.env = res.ok ? res.value : { gpg: null, card: null, keys: [], myKey: null };\n  return state.env;\n}\n\nconst hasGpg = () => Boolean(state.env && state.env.gpg);\nconst deviceOn = () => Boolean(state.env && state.env.card && state.env.card.serial);\nconst hasKey = () => Boolean(state.env && state.env.myKey);\n\nfunction renderStatusline() {\n  const el = $('statusline');\n  const ready = hasGpg() && deviceOn();\n  el.className = `status-row clickable ${ready ? 'ok' : 'waiting'}`;\n  el.lastElementChild.textContent = !hasGpg()\n    ? 'Setup needed — click here'\n    : !deviceOn()\n      ? 'Ledger not connected — click here'\n      : hasKey() ? 'Ledger connected, key in place' : 'Ledger connected, no key yet';\n}\n\n// the status line is clickable — it opens the guide at the relevant step\n$('statusline').addEventListener('click', () => openGuide(hasGpg() ? 4 : 1));\n\n/* ═══════════════════ setup guide ═══════════════════ */\n\nconst GUIDE = [\n  {\n    title: 'Encrypt any file',\n    lead: 'Sealbox locks a file so only you can open it, with your Ledger in hand.',\n    note: 'Setup is four short steps, once.',\n  },\n  {\n    title: 'Preparation',\n    lead: 'The app installs and configures everything itself.',\n    action: {\n      label: 'Prepare',\n      busy: 'Working…',\n      run: async () => {\n        const res = await bridge.setupPrepare();\n        if (!res.ok) throw new Error(res.error);\n        await refreshEnv();\n      },\n    },\n    check: () => hasGpg(),\n    checkText: { ok: 'Ready', wait: 'Press “Prepare”' },\n  },\n  {\n    title: 'The app on your Ledger',\n    lead: 'Install the OpenPGP app onto the device.',\n    steps: [\n      { text: 'Ledger Live → gear icon → Experimental features' },\n      { text: 'Turn on Developer mode' },\n      { text: 'My Ledger → find OpenPGP → Install' },\n    ],\n    note: 'If two apps are listed, pick OpenPGP without the “.XL”.',\n  },\n  {\n    title: 'Seed mode',\n    lead: 'Without it the key cannot be restored after a Ledger update.',\n    steps: [\n      { text: 'Quit Ledger Live' },\n      { text: 'Open OpenPGP on the device' },\n      { text: 'Settings → Seed mode → on' },\n    ],\n  },\n  {\n    title: 'Connection check',\n    lead: 'Leave OpenPGP open on the device screen. The dot turns green by itself.',\n    check: () => deviceOn(),\n    checkText: { ok: 'Device connected', wait: 'Looking for the device…' },\n    fix: {\n      label: 'Device not found',\n      run: async () => {\n        const next = await bridge.setupRetryLink();\n        if (next.ok && next.value) return 'Trying the other connection method, hold on';\n\n        const res = await bridge.setupEnableDriver();\n        if (!res.ok) throw new Error(res.error);\n        return 'Driver enabled. Restart your computer';\n      },\n    },\n  },\n];\n\n/** @param {number} from index of the step to open at */\nfunction openGuide(from = 0) {\n  state.step = from;\n  renderGuide();\n  show('screen-guide');\n  poll = setInterval(async () => { await refreshEnv(); renderCheck(); }, 2000);\n}\n\nfunction renderGuide() {\n  const step = GUIDE[state.step];\n\n  $('guide-dots').innerHTML = GUIDE\n    .map((_, i) => `<i class=\"${i < state.step ? 'done' : i === state.step ? 'now' : ''}\"></i>`)\n    .join('');\n\n  $('guide-title').textContent = step.title;\n  $('guide-lead').textContent = step.lead;\n\n  // numbered step row\n  $('guide-steps').innerHTML = (step.steps || [])\n    .map((s, i) => `\n      <div class=\"step-row\">\n        <span class=\"step-num\">${i + 1}</span>\n        <div class=\"step-text\">\n          <div class=\"step-title\">${s.text}</div>\n          ${s.sub ? `<div class=\"step-sub\">${s.sub}</div>` : ''}\n        </div>\n      </div>`)\n    .join('');\n  $('guide-steps').hidden = !(step.steps || []).length;\n\n  $('guide-note').hidden = !step.note;\n  if (step.note) $('guide-note').textContent = step.note;\n\n  const action = $('btn-guide-action');\n  action.hidden = !step.action;\n  action.disabled = false;\n  if (step.action) action.textContent = step.action.label;\n\n  $('guide-log').hidden = true;\n  $('guide-log').textContent = '';\n\n  const fix = $('btn-guide-fix');\n  fix.hidden = !step.fix;\n  if (step.fix) fix.textContent = step.fix.label;\n\n  $('btn-guide-back').textContent = state.step === 0 ? 'Skip' : 'Back';\n  $('btn-guide-next').textContent = state.step === GUIDE.length - 1 ? 'Finish' : 'Next';\n\n  renderCheck();\n}\n\nfunction renderCheck() {\n  const step = GUIDE[state.step];\n  const box = $('guide-check');\n  if (!step || !step.check) { box.hidden = true; $('btn-guide-next').disabled = false; return; }\n\n  const ok = step.check();\n  box.hidden = false;\n  box.className = `status-row ${ok ? 'ok' : 'waiting'}`;\n  $('guide-check-text').textContent = ok ? step.checkText.ok : step.checkText.wait;\n  $('btn-guide-next').disabled = !ok;\n\n  // hide the action button once the step is satisfied\n  const action = $('btn-guide-action');\n  if (step.action) action.hidden = ok;\n  if (step.fix) $('btn-guide-fix').hidden = ok;\n}\n\n$('btn-guide-action').addEventListener('click', async () => {\n  const step = GUIDE[state.step];\n  if (!step.action) return;\n\n  const button = $('btn-guide-action');\n  button.disabled = true;\n  button.textContent = step.action.busy || 'Working…';\n\n  // while work is in progress show this, not “press Prepare”\n  const box = $('guide-check');\n  box.hidden = false;\n  box.className = 'status-row waiting';\n  $('guide-check-text').textContent = 'Installing, please wait…';\n\n  const log = $('guide-log');\n  log.hidden = false;\n  log.textContent = '';\n  const stop = bridge.onSetupProgress((line) => {\n    log.textContent += `${line}\\n`;\n    log.scrollTop = log.scrollHeight;\n  });\n\n  try {\n    await step.action.run();\n    renderCheck();\n  } catch (err) {\n    log.textContent += `\\n${err.message}\\n`;\n    button.disabled = false;\n    button.textContent = 'Try again';\n  } finally {\n    stop();\n  }\n});\n\n$('btn-guide-fix').addEventListener('click', async () => {\n  const step = GUIDE[state.step];\n  if (!step.fix) return;\n\n  const button = $('btn-guide-fix');\n  button.disabled = true;\n  try {\n    const message = await step.fix.run();\n    $('guide-check-text').textContent = message;\n  } catch (err) {\n    $('guide-check-text').textContent = err.message;\n  } finally {\n    button.disabled = false;\n  }\n});\n\n$('btn-guide-next').addEventListener('click', () => {\n  if (state.step === GUIDE.length - 1) {\n    // if a file was waiting when the guide opened, go straight back to it\n    if (state.file) return accept(state.file.path);\n    return reset();\n  }\n  state.step += 1;\n  renderGuide();\n});\n\n$('btn-guide-back').addEventListener('click', () => {\n  if (state.step === 0) return reset();\n  state.step -= 1;\n  renderGuide();\n});\n\n$('btn-help').addEventListener('click', () => openGuide(0));\n$('btn-err-help').addEventListener('click', () => openGuide(1));\n\n/* ═══════════════════ accepting a file ═══════════════════ */\n\nconst dropzone = $('dropzone');\nlet dragDepth = 0;\n\ndocument.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth += 1; dropzone.classList.add('is-over'); });\ndocument.addEventListener('dragover', (e) => e.preventDefault());\ndocument.addEventListener('dragleave', (e) => {\n  e.preventDefault();\n  dragDepth = Math.max(0, dragDepth - 1);\n  if (dragDepth === 0) dropzone.classList.remove('is-over');\n});\ndocument.addEventListener('drop', async (e) => {\n  e.preventDefault();\n  dragDepth = 0;\n  dropzone.classList.remove('is-over');\n  const file = e.dataTransfer && e.dataTransfer.files[0];\n  if (!file) return;\n  const p = bridge.pathForFile(file);\n  if (p) await accept(p);\n});\n\n$('btn-pick').addEventListener('click', async () => {\n  const res = await bridge.pickFile();\n  if (res && res.ok && res.value) await accept(res.value);\n});\n\nasync function accept(filePath) {\n  await refreshEnv();\n\n  const res = await bridge.inspect(filePath);\n  if (!res.ok) return fail('That did not work', res.error);\n\n  const info = res.value;\n  if (info.isDirectory) {\n    return fail('That is a folder', 'Only single files are supported for now. Compress the folder first: right-click it and choose Compress.');\n  }\n  state.file = info;\n\n  if (info.encryption === 'publicKey') return openDecrypt(info);\n\n  if (info.encryption === 'password') {\n    return fail(\n      'This file is password-protected',\n      'It was locked with a password, not with a device. Sealbox only works with a Ledger.',\n      'You can open it in Terminal with: gpg --decrypt filename'\n    );\n  }\n\n  // Something is missing — open the guide at exactly that step instead of\n  // showing an error. The file stays in state and we come back to it.\n  if (!hasGpg()) return openGuide(1);\n  if (!deviceOn()) return openGuide(4);\n\n  if (!hasKey()) return openNewKey(info);\n  openEncrypt(info);\n}\n\n/* ═══════════════════ key creation ═══════════════════ */\n\nfunction openNewKey(info) {\n  $('nk-context').textContent = `“${info.name}” is waiting. We will create the key and lock it right away.`;\n  show('screen-newkey');\n  validateNewKey();\n  poll = setInterval(async () => { await refreshEnv(); validateNewKey(); }, 2500);\n  setTimeout(() => $('nk-name').focus(), 150);\n}\n\n['nk-name', 'nk-email'].forEach((id) => {\n  $(id).addEventListener('input', validateNewKey);\n  $(id).addEventListener('keydown', (e) => {\n    if (e.key === 'Enter' && !$('btn-genkey').disabled) $('btn-genkey').click();\n  });\n});\n\nfunction validateNewKey() {\n  const name = $('nk-name').value.trim();\n  const email = $('nk-email').value.trim();\n  const okName = name.length >= 5;\n  const okMail = /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email);\n  const on = deviceOn();\n\n  const box = $('nk-check');\n  box.className = `status-row ${on ? 'ok' : 'waiting'}`;\n  $('nk-check-text').textContent = on\n    ? `Ledger connected · ${state.env.card.serial}`\n    : 'Waiting for the device. Plug in the Ledger and open OpenPGP on it';\n\n  $('btn-genkey').disabled = !(okName && okMail && on);\n}\n\n$('btn-toggle-log').addEventListener('click', () => {\n  const log = $('key-log');\n  log.hidden = !log.hidden;\n  $('btn-toggle-log').textContent = log.hidden ? 'Show details' : 'Hide details';\n});\n\n$('btn-genkey').addEventListener('click', async () => {\n  const identity = { name: $('nk-name').value.trim(), email: $('nk-email').value.trim() };\n\n  $('key-log').textContent = '';\n  show('screen-keybusy');\n\n  const stop = bridge.onKeyProgress((line) => {\n    const log = $('key-log');\n    log.textContent += `${line}\\n`;\n    log.scrollTop = log.scrollHeight;\n  });\n\n  const res = await bridge.generateKey(identity);\n  stop();\n\n  if (!res.ok) {\n    return fail(\n      'Could not create the key',\n      res.error,\n      'Check that the Ledger is connected, the OpenPGP app is open on it, and Ledger Live is closed'\n    );\n  }\n\n  state.recovery = res.value.recovery;\n  renderRecovery(res.value.recovery);\n  await refreshEnv();\n  show('screen-keydone');\n});\n\nfunction renderRecovery(r) {\n  const rows = [\n    ['Timestamp', r.fakedTime],\n    ['Name', r.name],\n    ['Email', r.email],\n    ['Device', r.serial || '—'],\n    ['Fingerprint', shortFpr(r.fingerprint) || '—'],\n  ];\n  const box = $('recovery-box');\n  box.textContent = '';\n  rows.forEach(([label, value]) => {\n    const row = document.createElement('div');\n    row.className = 'kv-row';\n    const key = document.createElement('span');\n    key.className = 'kv-key';\n    key.textContent = label;\n    const val = document.createElement('span');\n    val.className = 'kv-val mono';\n    val.textContent = value;\n    row.append(key, val);\n    box.append(row);\n  });\n}\n\n$('btn-save-recovery').addEventListener('click', async () => {\n  const res = await bridge.saveRecovery(state.recovery);\n  if (!res.ok) return fail('Could not save', res.error);\n  if (res.value) {\n    $('btn-save-recovery').textContent = 'Saved ✓';\n    $('btn-save-recovery').disabled = true;\n  }\n});\n\n$('btn-continue').addEventListener('click', () => {\n  $('btn-save-recovery').textContent = 'Save the recovery card';\n  $('btn-save-recovery').disabled = false;\n  if (state.file) openEncrypt(state.file);\n  else reset();\n});\n\n/* ═══════════════════ encryption ═══════════════════ */\n\nfunction openEncrypt(info) {\n  const my = state.env.myKey;\n  $('enc-name').textContent = info.name;\n  $('enc-size').textContent = humanSize(info.size);\n  $('mk-title').textContent = (my && my.uids[0]) || '—';\n\n  show('screen-encrypt');\n  updateEncCheck();\n  poll = setInterval(async () => { await refreshEnv(); updateEncCheck(); }, 2500);\n}\n\nfunction updateEncCheck() {\n  const on = deviceOn();\n  const box = $('enc-check');\n  box.className = `status-row ${on ? 'ok' : 'waiting'}`;\n  $('enc-check-text').textContent = on\n    ? 'Ledger connected — it will confirm the operation'\n    : 'Plug in the Ledger and open the OpenPGP app on it';\n  $('btn-encrypt').disabled = !on;\n}\n\n$('btn-encrypt').addEventListener('click', async () => {\n  const file = state.file;\n  const my = state.env.myKey;\n  const id = my.fingerprint || my.keyId;\n\n  busy('Locking the file', 'Look at the Ledger: it will ask for a PIN and a confirmation. Factory default is 123456.');\n\n  const res = await bridge.encryptWithKey(file.path, id, id);\n  if (!res.ok) {\n    return fail('Could not lock the file', res.error,\n      'Check that the Ledger is connected and the OpenPGP app is open on it');\n  }\n  done('File locked', res.value, file.path, 'It can only be opened with your Ledger.');\n});\n\n/* ═══════════════════ decryption ═══════════════════ */\n\nfunction openDecrypt(info) {\n  $('dec-name').textContent = info.name;\n  $('dec-size').textContent = humanSize(info.size);\n  show('screen-decrypt');\n  updateDecCheck();\n  poll = setInterval(async () => { await refreshEnv(); updateDecCheck(); }, 2500);\n}\n\nfunction updateDecCheck() {\n  const on = deviceOn();\n  const box = $('dec-check');\n  box.className = `status-row ${on ? 'ok' : 'waiting'}`;\n  $('dec-check-text').textContent = on\n    ? 'Ledger connected — ready to open'\n    : 'Plug in the Ledger and open the OpenPGP app on it';\n  $('btn-decrypt').disabled = !on;\n}\n\n$('btn-decrypt').addEventListener('click', async () => {\n  busy('Opening the file', 'Look at the Ledger: it will ask for a PIN. Factory default is 123456.');\n\n  const res = await bridge.decryptWithCard(state.file.path);\n  if (!res.ok) {\n    return fail('Could not open the file', res.error,\n      'Make sure this is the same Ledger the file was locked with');\n  }\n  done('File opened', res.value, null, 'The plain file now sits next to the locked one.');\n});\n\n/* ═══════════════════ progress and result ═══════════════════ */\n\nfunction busy(text, tip) {\n  $('busy-text').textContent = text;\n  $('busy-tip').textContent = (tip || '').replace(/<\\/?b>/g, '');\n  show('screen-busy');\n}\n\nfunction done(title, result, sourcePath, explain) {\n  state.result = result.outputPath;\n  state.source = sourcePath;\n  $('done-title').textContent = title;\n  $('done-file').textContent = result.name;\n  $('done-explain').textContent = explain || '';\n  $('btn-trash').hidden = !sourcePath;\n  show('screen-done');\n}\n\n$('btn-reveal').addEventListener('click', () => state.result && bridge.reveal(state.result));\n\n$('btn-trash').addEventListener('click', async () => {\n  if (!state.source) return;\n  const res = await bridge.trash(state.source);\n  if (!res.ok) return fail('Could not move the file', res.error);\n  $('btn-trash').hidden = true;\n  $('done-explain').textContent = 'The unlocked file has been moved to Trash.';\n});\n\n/* ═══════════════════ demo mode ═══════════════════ */\n\nfunction demoApi() {\n  const wait = (ms) => new Promise((r) => setTimeout(r, ms));\n  const ok = (value) => ({ ok: true, value });\n\n  let myKey = null;\n  let progress = () => {};\n  let prepared = false;   // as on a first launch: preparation has not run yet\n\n  const files = {\n    '/Users/boris/Documents/Lease agreement.docx':\n      { name: 'Lease agreement.docx', size: 1_284_096, encryption: 'none', isDirectory: false },\n    '/Users/boris/Documents/Lease agreement.docx.gpg':\n      { name: 'Lease agreement.docx.gpg', size: 1_285_318, encryption: 'publicKey', isDirectory: false },\n  };\n  const names = Object.keys(files);\n  let cursor = 0;\n\n  return {\n    pathForFile: (f) => f.path || names[0],\n\n    status: async () => ok({\n      gpg: prepared ? '/opt/homebrew/bin/gpg' : null,\n      version: prepared ? 'gpg (GnuPG) 2.4.8' : null,\n      card: { serial: '937F8BE3', reader: 'Ledger Nano X' },\n      appVersion: '1.0.0',\n      myKey,\n      keys: myKey ? [myKey] : [],\n    }),\n    setupPrepare: async () => {\n      for (const line of [\n        'Checking what is already installed…',\n        'Installing. This can take a few minutes…',\n        '==> Pouring gnupg--2.4.8.arm64_sonoma.bottle.tar.gz',\n        '==> Pouring pinentry-mac--1.1.1.arm64_sonoma.bottle.tar.gz',\n        'Configuring the device connection…',\n      ]) { progress(line); await wait(650); }\n      prepared = true;\n      return ok({});\n    },\n    setupRetryLink: async () => { await wait(600); return ok('pcsc'); },\n    setupEnableDriver: async () => { await wait(600); return ok(true); },\n    onSetupProgress: (cb) => { progress = cb; return () => { progress = () => {}; }; },\n\n\n    onKeyProgress: (cb) => { progress = cb; return () => { progress = () => {}; }; },\n\n    generateKey: async (identity) => {\n      const lines = [\n        'device 937F8BE3',\n        '← cardedit.prompt: admin',\n        '← cardedit.prompt: generate',\n        '← cardedit.genkeys.backup_enc: n',\n        '← keygen.valid: 0',\n        `← keygen.name: ${identity.name}`,\n        `← keygen.email: ${identity.email}`,\n        '← keygen.userid.cmd: O',\n        'gpg: waiting for confirmation on the device…',\n        'key created',\n      ];\n      for (const l of lines) { progress(l); await wait(260); }\n\n      myKey = {\n        keyId: 'E4C302BC8672419D',\n        fingerprint: '60F7D30628782B4AAA3A3782E4C302BC8672419D',\n        uids: [`${identity.name} <${identity.email}>`],\n        onCard: true,\n      };\n      return ok({\n        fingerprint: myKey.fingerprint,\n        recovery: {\n          fakedTime: '19990101T000000!',\n          name: identity.name,\n          email: identity.email,\n          serial: '937F8BE3',\n          fingerprint: myKey.fingerprint,\n        },\n      });\n    },\n\n    saveRecovery: async () => { await wait(400); return ok('/Users/boris/Documents/sealbox-recovery.txt'); },\n    inspect: async (p) => { await wait(120); return ok({ path: p, keyIds: [], ...files[p] }); },\n    pickFile: async () => { const p = names[cursor % names.length]; cursor += 1; return ok(p); },\n\n    encryptWithKey: async () => { await wait(1800); return ok({ outputPath: '/x.gpg', name: 'Lease agreement.docx.gpg' }); },\n    decryptWithCard: async () => { await wait(1600); return ok({ outputPath: '/x', name: 'Lease agreement.docx' }); },\n\n    reveal: async () => ok(true),\n    trash: async () => { await wait(300); return ok(true); },\n  };\n}\n\n/* ═══════════════════ start ═══════════════════ */\n\n/*\n * The app always opens on the drop screen. The setup guide is not a gate:\n * it appears only when something is actually missing, at the step that is\n * missing — either because the user dropped a file and we cannot proceed,\n * or because they clicked the status line or the \"?\" button.\n */\n(async function start() {\n  // Show the drop screen immediately. Probing the environment can take several\n  // seconds — searching for gpg, asking the card for its status — and the window\n  // used to stay blank for the whole of it, which reads as a broken app.\n  state.env = { gpg: null, card: null, keys: [], myKey: null };\n  show('screen-drop');\n  $('statusline').lastElementChild.textContent = 'Checking…';\n\n  await refreshEnv();\n  // the badge shows the real app version, so it can never drift from package.json\n  if (state.env && state.env.appVersion) $('version-badge').textContent = `v${state.env.appVersion}`;\n  reset();\n})();\n\n<\/script>\n</body>\n</html>\n";
